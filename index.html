/* Small, DOM-free traversal decisions. Runtime geometry is supplied as an
   isSolid cell callback so authored rectangles and ground use one contract. */
function traversalLedgeProbe(state, geometry, cfg = CONFIG.player) {
  if (state.grounded || state.vy >= 0 || state.down ||
      state.now < state.recatchUntil) return null;

  const toward = Math.sign(state.hInput || state.vx);
  if (!toward) return null;
  const side = toward;
  const cellX = Math.floor(state.x + side * (state.hw + cfg.ledgeReachX));
  if (cellX < geometry.minCellX || cellX >= geometry.maxCellX) return null;

  const faceX = side > 0 ? cellX : cellX + 1;
  const gap = side > 0
    ? faceX - (state.x + state.hw)
    : (state.x - state.hw) - faceX;
  if (gap < -0.03 || gap > cfg.ledgeReachX) return null;

  const handY = state.y + cfg.ledgeGrabHeight;
  const topY = Math.round(handY);
  if (Math.abs(handY - topY) > cfg.ledgeReachY ||
      !geometry.isSolid(cellX, topY - 1) ||
      geometry.isSolid(cellX, topY)) return null;

  const snapX = faceX - side * (state.hw + 0.001);
  const snapY = topY - cfg.ledgeGrabHeight;
  if (snapX - state.hw < geometry.minPlayerX) return null;

  // The hanging body and head must both fit on the approach side.
  const outsideX = cellX - side;
  for (let j = Math.floor(snapY + 0.02);
       j <= Math.floor(snapY + state.h - 0.02); j++) {
    if (geometry.isSolid(outsideX, j)) return null;
  }
  return { side, cellX, topY, snapX, snapY };
}

function traversalLedgeDecision(state, cfg = CONFIG.player) {
  if (state.down) {
    return { kind: 'release', recatchUntil: state.now + cfg.traversalRecatchMs };
  }
  if (state.jumpBuffered) {
    const entrySpeed = Math.abs(state.entryVx || 0);
    return {
      kind: 'launch',
      vx: state.side * Math.max(cfg.ledgeLaunchX, entrySpeed),
      vy: cfg.ledgeLaunchY,
      recatchUntil: state.now + cfg.traversalRecatchMs,
    };
  }
  if (state.now >= state.until) {
    return { kind: 'release', recatchUntil: state.now + cfg.traversalRecatchMs };
  }
  return { kind: 'hang', vx: 0, vy: 0 };
}

function traversalWallDecision(state, geometry, cfg = CONFIG.player) {
  const side = Math.sign(state.side);
  let touchesWall = false;
  for (let j = Math.floor(state.y + 0.02);
       side !== 0 && !state.grounded &&
       state.cellX >= geometry.minCellX && state.cellX < geometry.maxCellX &&
       j <= Math.floor(state.y + state.h - 0.02); j++) {
    if (geometry.isSolid(state.cellX, j)) { touchesWall = true; break; }
  }
  if (!touchesWall || state.down) {
    return { kind: 'release', recatchUntil: state.now + cfg.traversalRecatchMs };
  }
  if (state.jumpBuffered) {
    return {
      kind: 'jump',
      vx: -side * cfg.wallJumpX,
      vy: cfg.wallJumpY,
      recatchUntil: state.now + cfg.traversalRecatchMs,
    };
  }
  if (state.hInput === -side || state.now >= state.until) {
    return { kind: 'release', recatchUntil: state.now + cfg.traversalRecatchMs };
  }
  return { kind: 'slide', vx: 0, vy: Math.max(state.vy, -cfg.wallSlideSpeed) };
}

/* ============================= PATH =============================== */
/* Pure polyline math for the hexagonal tower. Gameplay simulates in
   logical coords (s = distance along the level in tiles, y = height);
   only rendering maps s → world via these. No three.js, no DOM. */

const DEG = Math.PI / 180;

function cornerSList(cfg) {
  const out = [];
  for (let k = 1; k <= cfg.path.faces; k++) out.push(cfg.path.introTiles + cfg.path.faceTiles * k);
  return out;
}

function haltSFor(cornerS, cfg) { return cornerS - cfg.waves.haltOffset; }

// face index of a distance s: 0 = intro, 1..faces = tower faces, faces+1 = outro
function faceIndexAt(s, cfg) {
  const p = cfg.path;
  if (s < p.introTiles) return 0;
  return Math.min(Math.floor((s - p.introTiles) / p.faceTiles) + 1, p.faces + 1);
}

// segment table: sharp polyline with a 2-tile chamfer (two turnDeg bends)
// at every corner. Headings sum to a full 360° circuit after 6 corners.
function buildSegments(cfg) {
  const turn = cfg.path.turnDeg * DEG * cfg.path.turnSign;
  const segs = [{ s0: 0, x: 0, z: 0, heading: 0 }];
  for (const cs of cornerSList(cfg)) {
    for (const bs of [cs, cs + cfg.path.chamferTiles]) {
      const prev = segs[segs.length - 1];
      const len = bs - prev.s0;
      segs.push({
        s0: bs,
        x: prev.x + Math.cos(prev.heading) * len,
        z: prev.z - Math.sin(prev.heading) * len,
        heading: prev.heading + turn,
      });
    }
  }
  return segs;
}

function segAt(segs, s) {
  for (let i = segs.length - 1; i >= 0; i--) if (s >= segs[i].s0) return segs[i];
  return segs[0];
}

function polyAt(segs, s, out = { x: 0, z: 0 }) { // s → world position at height 0;
  const g = segAt(segs, s);                      //   out-param lets per-frame callers
  const d = s - g.s0;                            //   reuse one scratch (no GC churn)
  out.x = g.x + Math.cos(g.heading) * d;
  out.z = g.z - Math.sin(g.heading) * d;
  return out;
}

function headingAt(segs, s) { return segAt(segs, s).heading; }   // sharp, per segment

// blended heading for dynamic entities: smoothstep each bend's turn over
// ±blend tiles so rigs don't pop 30° when crossing a bend column.
function yawAt(segs, s, blend) {
  if (!(blend > 0)) return headingAt(segs, s);
  let yaw = segs[0].heading;
  for (let i = 1; i < segs.length; i++) {
    if (s <= segs[i].s0 - blend) break;        // segs sorted by s0: later bends add 0
    const d = segs[i].heading - segs[i - 1].heading;
    const u = Math.min(1, Math.max(0, (s - (segs[i].s0 - blend)) / (2 * blend)));
    yaw += d * u * u * (3 - 2 * u);
  }
  return yaw;
}

const CORNER_S = cornerSList(CONFIG);            // [89, 154, 219, 284, 349, 414]
const SEGS = buildSegments(CONFIG);
const HALT_S = CORNER_S.map((cs) => haltSFor(cs, CONFIG));

/* ============================ WAVES =============================== */
/* Pure choreography math for wave gates and the corner ritual: the
   yaw-snap timeline, the scroll resume curve, and the brick zipper.
   All timings are event-local ms (t = gameMs - tStart). */

function waveSize(k, cfg) { return cfg.waves.baseSize + cfg.waves.sizePerWave * k; }

function waveLane(k, i, cfg) {                   // per-wave altitude composition
  const comp = cfg.waves.comp[k - 1];
  return cfg.waves.laneHeights[comp[i % comp.length]];
}

function easeOutBack(u, s) {
  const v = u - 1;
  return 1 + (s + 1) * v * v * v + s * v * v;
}

function cornerTimeline(cfg) {
  const W = cfg.waves;
  const t1 = W.windUpMs;                         // wind-up ends
  const t2 = t1 + W.snap1Ms;                     // snap 1 impact frame
  const t3 = t2 + W.holdMs;                      // ratchet hold ends
  const t4 = t3 + W.snap2Ms;                     // snap 2 lands
  const t5 = t4 + W.settleMs;                    // settle ends, scroll resumes
  const t6 = t5 + W.resumeMs;                    // event done
  return { t1, t2, t3, t4, t5, t6 };
}

function cornerEventTotalMs(cfg) { return cornerTimeline(cfg).t6; }

// camera yaw delta (degrees) over the event: 0 → -1.5 → 30 → hold → 60
function cornerYawDeltaDeg(tMs, cfg) {
  const W = cfg.waves;
  const T = cornerTimeline(cfg);
  const snap = cfg.path.turnDeg;                 // per-snap magnitude (30)
  if (tMs <= 0) return 0;
  if (tMs < T.t1) { const u = tMs / W.windUpMs; return W.windUpDeg * u * u; }
  if (tMs < T.t2) { const u = (tMs - T.t1) / W.snap1Ms; return W.windUpDeg + (snap - W.windUpDeg) * easeOutBack(u, W.backS); }
  if (tMs < T.t3) return snap;
  if (tMs < T.t4) { const u = (tMs - T.t3) / W.snap2Ms; return snap + snap * easeOutBack(u, W.backS); }
  return snap * 2;
}

// scroll velocity during the event: frozen, then quadratic ease back in
function cornerScrollVel(tMs, cfg) {
  const T = cornerTimeline(cfg);
  if (tMs < T.t5) return 0;
  const u = Math.min(1, (tMs - T.t5) / cfg.waves.resumeMs);
  return cfg.scrollSpeed * u * u;
}

// brick-slam zipper: column j (0-based within the slam set) drops from
// zipDropTiles above with gravity ease, dips one beat, then locks.
function zipperOffset(tMs, colIdx, cfg) {
  const W = cfg.waves;
  const local = tMs - (W.zipStartMs + colIdx * W.zipPerColMs);
  if (local < 0) return { phase: 'hidden', dy: 0 };
  if (local < W.zipDropMs) {
    const u = local / W.zipDropMs;
    return { phase: 'drop', dy: W.zipDropTiles * (1 - u * u) };
  }
  if (local < W.zipDropMs + W.zipDipMs) return { phase: 'dip', dy: -W.zipDipTiles };
  return { phase: 'locked', dy: 0 };
}

/* =========================== GENERATOR ============================ */
/* Pattern-chunk layout + ambient spawn-director math. Pure: no three.js,
   no DOM — the harness rebuilds the level and asserts every invariant.
   Ground is authored as a stream of named chunks (flats, steps, stairs,
   plateaus, trenches, gap hops, island hops, ridges) instead of a
   coin-flip walk. Invariants: heights within [minH, maxH]; adjacent
   solid columns differ by ≤ 2; gap runs ≤ gapMax with ≥ landingMin solid
   columns after and ≤ 1 height change across; intro + tail flat; corner
   aprons flat and platform-free; every catwalk within maxReach. */

const GAP = -999;

function solidRectContains(rect, x, y) {
  return x >= rect.x0 && x < rect.x1 && y >= rect.y0 && y < rect.y1;
}

function levelSolidCell(level, i, j, tileDepth) {
  const g = level.groundH[i];
  if (g > -100 && j < g && j >= g - tileDepth) return true;
  for (const rect of level.solidRects || []) if (solidRectContains(rect, i, j)) return true;
  return false;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function clampH(v, g) { return Math.max(g.minH, Math.min(g.maxH, v)); }

// Each chunk emits {cols, h}: column heights (GAP for gaps) plus the walk
// height after the chunk. Every chunk's last solid column equals its
// returned h, so chunk-to-chunk seams can never step more than the
// chunk's own internal moves (≤ 2).
const CHUNK_LIB = [
  ['flat', (rng, h, g) => ({ cols: new Array(4 + Math.floor(rng() * 5)).fill(h), h })],
  ['step', (rng, h, g) => {                    // single ledge up/down (±1, sometimes ±2)
    const nh = clampH(h + (rng() < 0.5 ? -1 : 1) * (rng() < 0.3 ? 2 : 1), g);
    return { cols: new Array(3 + Math.floor(rng() * 4)).fill(nh), h: nh };
  }],
  ['stairs', (rng, h, g) => {                  // 2–3 risers with short treads
    const dir = rng() < 0.5 ? 1 : -1;
    const cols = [];
    let hh = h;
    for (let i = 0, n = 2 + Math.floor(rng() * 2); i < n; i++) {
      hh = clampH(hh + dir, g);
      for (let j = 0, run = 2 + Math.floor(rng() * 2); j < run; j++) cols.push(hh);
    }
    return { cols, h: hh };
  }],
  ['gapHop', (rng, h, g) => {                  // gap + guaranteed landing strip
    const cols = new Array(2 + Math.floor(rng() * (g.gapMax - 1))).fill(GAP);
    for (let j = 0; j < g.landingMin; j++) cols.push(h);
    return { cols, h };
  }],
  ['plateau', (rng, h, g) => {                 // raised slab, then back down
    const cols = new Array(3 + Math.floor(rng() * 3)).fill(clampH(h + 2, g));
    for (let j = 0, run = 2 + Math.floor(rng() * 2); j < run; j++) cols.push(h);
    return { cols, h };
  }],
  ['trench', (rng, h, g) => {                  // dip to the floor, climb back out
    const cols = new Array(3 + Math.floor(rng() * 3)).fill(g.minH);
    for (let j = 0, run = 2 + Math.floor(rng() * 2); j < run; j++) cols.push(h);
    return { cols, h };
  }],
  ['islandHop', (rng, h, g) => {               // gap, 3-tile island, gap, landing
    const cols = [GAP, GAP, h, h, h, GAP, GAP];
    for (let j = 0; j < g.landingMin; j++) cols.push(h);
    return { cols, h };
  }],
  ['ridge', (rng, h, g) => {                   // bumpy rhythm of one-tile lips
    const hi = clampH(h + 1, g);
    const cols = [];
    for (let c = 0, n = 2 + Math.floor(rng() * 2); c < n; c++) cols.push(h, h, hi, hi);
    cols.push(h, h);
    return { cols, h };
  }],
];

function pickChunk(rng, weights) {
  let total = 0;
  for (const [name] of CHUNK_LIB) total += weights[name];
  let r = rng() * total;
  for (const entry of CHUNK_LIB) {
    r -= weights[entry[0]];
    if (r < 0) return entry;
  }
  return CHUNK_LIB[0];
}

function buildLevel(cfg) {
  const L = cfg.levelLength;
  const G = cfg.gen;
  const corners = cornerSList(cfg);
  const groundH = new Array(L);
  const platforms = [];                        // one-way catwalks {x0, x1, y}
  const chunkLog = [];                         // chunk names, for variety asserts
  const rng = mulberry32(G.seed);

  // ground: flat intro, chunk stream, flat outro tail
  let x = 0, h = 3;
  while (x < cfg.path.introTiles) groundH[x++] = 3;
  const tail = L - G.tailFlat;
  while (x < tail) {
    const picked = pickChunk(rng, G.weights);
    const c = picked[1](rng, h, G);
    chunkLog.push(picked[0]);
    for (const col of c.cols) {
      if (x >= tail) break;
      groundH[x++] = col;
    }
    h = c.h;
  }
  while (x < L) groundH[x++] = 3;

  // Contra tiers: a near-continuous mid lane (+2.35 over local ground) with
  // high lane stretches (+3 again) above it. All one-way: jump up through
  // them, down+jump drops a tier. Mid needs a committed full-hold jump —
  // analytic apex is 2.72, but the semi-implicit integrator's discrete apex
  // is 2.61 @60Hz and 2.49 @30Hz, so +2.35 keeps mounting frame-rate safe
  // (margins +0.26 / +0.14). High still needs the double jump (mid→high +3).
  const prng = mulberry32(G.tierSeed);
  let cx = 26;
  while (cx < L - 28) {
    const segLen = 7 + Math.floor(prng() * 6);         // 7–12 column segments: denser rhythm
    let base = 2;
    for (let k = cx; k < Math.min(cx + segLen, L); k++)
      if (groundH[k] > -100) base = Math.max(base, groundH[k]);
    if (prng() < G.laneChance) {
      const len = segLen - 2 - Math.floor(prng() * 2); // leaves 2–3 column lane gaps
      const y = base + 2.35;
      platforms.push({ x0: cx, x1: cx + len, y });
      if (y + 3 <= G.laneCapY && prng() < G.hiChance) {
        const hiLen = Math.max(3, len - 3);
        const off = 1 + Math.floor(prng() * 2);
        const yHi = y + 3;
        platforms.push({ x0: cx + off, x1: cx + off + hiLen, y: yHi });
        if (yHi + 3 <= G.laneCapY && prng() < G.thirdChance) {   // third tier over low ground
          platforms.push({ x0: cx + off + 1, x1: cx + off + 1 + Math.max(3, hiLen - 2), y: yHi + 3 });
        }
      }
    }
    cx += segLen;
  }

  // corner aprons (corner-zone cleanliness): solid flat staging ground
  // through each chamfer — the pivot and both bend columns must be ground,
  // not gap — and no catwalk may span a bend.
  for (const cs of corners) {
    for (let s = cs - 5; s <= cs + 2; s++) groundH[s] = 3;
    for (let i = platforms.length - 1; i >= 0; i--)
      if (platforms[i].x1 >= cs - 3 && platforms[i].x0 <= cs + 3) platforms.splice(i, 1);
  }

  // reachability sweep: the apron pass can orphan a high catwalk whose mid
  // support it deleted — prune anything beyond double-jump reach, repeating
  // until stable (pruning one support can strand another).
  let pruned = true;
  while (pruned) {
    pruned = false;
    for (let i = platforms.length - 1; i >= 0; i--) {
      const p = platforms[i];
      let best = -999;
      for (let k = Math.max(0, p.x0 - 1); k <= Math.min(L - 1, p.x1 + 1); k++)
        if (groundH[k] > -100) best = Math.max(best, groundH[k]);
      for (const q of platforms)
        if (q !== p && q.y < p.y && q.x1 > p.x0 - 1 && q.x0 < p.x1 + 1) best = Math.max(best, q.y);
      if (p.y - best > G.maxReach) { platforms.splice(i, 1); pruned = true; }
    }
  }

  return { groundH, platforms, chunkLog };
}

function buildTraversalLevel(cfg) {
  const base = buildLevel(cfg);
  const B = TRAVERSAL_FIXTURE.bounds;
  for (const run of TRAVERSAL_FIXTURE.groundRuns)
    for (let x = run.x0; x < run.x1; x++) base.groundH[x] = run.y;
  const platforms = base.platforms.filter((p) => p.x1 <= B.x0 || p.x0 >= B.x1);
  for (const p of TRAVERSAL_FIXTURE.platforms) platforms.push({ ...p });
  return {
    groundH: base.groundH,
    platforms,
    solidRects: TRAVERSAL_FIXTURE.solidRects.map((r) => ({ ...r })),
    chunkLog: base.chunkLog.concat(TRAVERSAL_FIXTURE.id),
    fixture: TRAVERSAL_FIXTURE,
  };
}

// Ambient spawn table: density authored in seconds of scroll so it scales
// with scrollSpeed, escalating per face; corner-clear zones stay empty —
// gate waves are authored by the wave system, never by this table.
function buildSpawnTable(cfg) {
  const S = cfg.spawner;
  const corners = cornerSList(cfg);
  const rng = mulberry32(S.seed);
  const nearCorner = (x) =>
    corners.some((cs) => x >= cs - S.cornerClearBefore && x <= cs + S.cornerClearAfter);
  const out = [];
  const end = cfg.levelLength - S.endFromEnd;
  let x = S.startS;
  while (x < end) {
    const f = Math.min(cfg.path.faces, Math.max(1, faceIndexAt(x, cfg)));
    if (!nearCorner(x)) {
      out.push({ x, type: 'wasp' });
      if (rng() < S.pairChance[f - 1] && !nearCorner(x + S.pairGapTiles) && x + S.pairGapTiles < end)
        out.push({ x: x + S.pairGapTiles, type: 'wasp' });
    }
    x += Math.max(2, Math.round((S.faceGapSec[f - 1] + rng() * S.jitterSec) * cfg.scrollSpeed));
  }
  // one carrier per face at an authored mid-face fraction — same table, same
  // corner-clear discipline, harness-assertable like every other row. Nudge
  // off any occupied column: the table stays strictly ascending in x.
  const used = new Set(out.map((r) => r.x));
  cfg.carrier.perFaceFrac.forEach((frac, f) => {
    const start = f === 0 ? cfg.path.introTiles : corners[f - 1];
    let cx = Math.round(start + frac * (corners[f] - start));
    while (used.has(cx)) cx++;
    if (!nearCorner(cx)) { out.push({ x: cx, type: 'carrier' }); used.add(cx); }
  });
  out.sort((a, b) => a.x - b.x);
  return out;
}

// (s, y, depth) → tower world placement for a mesh. depth rides the outward
// face normal (positive = toward camera). Returns the yaw for callers that
// compose further on top of it. Every dynamic entity places through here.
function placeOnTower(mesh, s, y, depth) {
  const yaw = yawAt(SEGS, s, CONFIG.path.yawBlendTiles);
  const wp = polyAt(SEGS, s, _pp);
  mesh.position.set(wp.x + Math.sin(yaw) * depth, y, wp.z + Math.cos(yaw) * depth);
  mesh.rotation.y = yaw;
  return yaw;
}

function approach(v, target, step) {
  return v < target ? Math.min(target, v + step) : Math.max(target, v - step);
}

// Screen edges as constant s-offsets from scrollX, calibrated at boot and
// on resize with a probe camera at the local rig pose. Replaces per-frame
// frustum unprojection, which goes invalid the moment the camera yaws.
// Because they derive from scrollX, edges freeze during corner events.
let EDGE_L = 0, EDGE_R = 0;
const _edgeV = new THREE.Vector3();
const _probe = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, 0.1, 200);

function probeXAtNdc(ndcX) {
  _edgeV.set(ndcX, 0, 0.5).unproject(_probe).sub(_probe.position).normalize();
  return _probe.position.x + _edgeV.x * (-_probe.position.z / _edgeV.z);
}

function calibrateEdges() {
  const C = CONFIG.camera;
  _probe.fov = C.fov;
  _probe.aspect = innerWidth / innerHeight;
  _probe.position.set(C.x, C.y, C.z);
  _probe.lookAt(C.lookX, C.lookY, 0);
  _probe.updateProjectionMatrix();
  _probe.updateMatrixWorld(true);
  EDGE_L = probeXAtNdc(-1);
  EDGE_R = probeXAtNdc(1);
}

function sLeftEdge()  { return scrollX + EDGE_L; }
function sRightEdge() { return scrollX + EDGE_R; }

let tiles;
const tileBaseMats = [];                                  // final matrix per instance
const columnInstances = new Array(LEVEL_LEN).fill(null);  // col → {start, count, settled}
const faceRanges = [];                                    // face → {col0, col1, inst0, inst1}
const slamSets = [];                                      // corner k-1 → zipper column list
const farSets = [];                                       // corner k-1 → rest of the next face
const slatMeshes = [];                                    // catwalk slats {mesh, x0, x1}
const authoredSolidMeshes = [];                           // traversal-only tagged solid rectangles
{
  let count = 0;
  for (let i = 0; i < LEVEL_LEN; i++) if (groundH[i] > -100) count += VISUAL_DEPTH;

  const tileGeo = new THREE.BoxGeometry(1, 1, 2);
  const tileMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
  tiles = new THREE.InstancedMesh(tileGeo, tileMat, count);
  tiles.frustumCulled = false;

  const cA = new THREE.Color(CONFIG.palette.ground);
  const cB = new THREE.Color(CONFIG.palette.groundAlt);
  let idx = 0;
  for (let i = 0; i < LEVEL_LEN; i++) {
    const f = faceIndexAt(i, CONFIG);
    if (!faceRanges[f]) faceRanges[f] = { col0: i, col1: i, inst0: idx, inst1: idx - 1 };
    faceRanges[f].col1 = i;
    if (groundH[i] < -100) continue;                   // gap column: no instances
    const p = polyAt(SEGS, i + 0.5);
    const colYaw = headingAt(SEGS, i + 0.5);           // sharp per-column facing
    columnInstances[i] = { start: idx, count: VISUAL_DEPTH, settled: true };
    for (let d = 1; d <= VISUAL_DEPTH; d++) {
      const j = groundH[i] - d;
      const m = new THREE.Matrix4().makeRotationY(colYaw);
      m.setPosition(p.x, j + 0.5, p.z);
      tileBaseMats.push(m);
      tiles.setMatrixAt(idx, m);
      tiles.setColorAt(idx, (i + j) % 2 === 0 ? cA : cB);   // checker = scroll-speed readability
      idx++;
    }
    faceRanges[f].inst1 = idx - 1;
  }
  scene.add(tiles);

  for (const cs of CORNER_S) {                         // next face: zipper strip + far rest,
    const strip = [], far = [];                        //   both unbuilt until the ritual
    const faceEnd = Math.min(cs + CONFIG.path.faceTiles - 1, LEVEL_LEN - 1);
    for (let s = cs; s <= Math.min(cs + CONFIG.waves.zipCols - 1, LEVEL_LEN - 1); s++) strip.push(s);
    for (let s = cs + CONFIG.waves.zipCols; s <= faceEnd; s++) far.push(s);
    slamSets.push(strip);
    farSets.push(far);
  }

  const solidMat = new THREE.MeshStandardMaterial({ color: CONFIG.palette.groundAlt, flatShading: true });
  for (const rect of solidRects) {
    const midX = (rect.x0 + rect.x1) / 2;
    const midY = (rect.y0 + rect.y1) / 2;
    const wp = polyAt(SEGS, midX);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(rect.x1 - rect.x0, rect.y1 - rect.y0, 2),
      solidMat
    );
    mesh.position.set(wp.x, midY, wp.z);
    mesh.rotation.y = headingAt(SEGS, midX);
    mesh.userData.fixtureSolidId = rect.id;
    scene.add(mesh);
    authoredSolidMeshes.push(mesh);
  }

  const walkMat = new THREE.MeshStandardMaterial({ color: CONFIG.palette.catwalk, flatShading: true });
  for (const p of platforms) {
    const len = p.x1 - p.x0;
    const mid = (p.x0 + p.x1) / 2;
    const wp = polyAt(SEGS, mid);
    const slat = new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, 1.4), walkMat);
    slat.position.set(wp.x, p.y - 0.09, wp.z);
    slat.rotation.y = headingAt(SEGS, mid);            // aprons keep slats off the bends
    scene.add(slat);
    slatMeshes.push({ mesh: slat, x0: p.x0, x1: p.x1 });
  }
  hideAllSlamColumns();                                // after slats: they hide with their face
}

function hideAllSlamColumns() {          // next faces stay unbuilt until their ritual
  for (const sets of [slamSets, farSets]) {
    for (const cols of sets) {
      for (const s of cols) {
        const col = columnInstances[s];
        if (!col) continue;
        col.settled = false;
        for (let n = 0; n < col.count; n++) tiles.setMatrixAt(col.start + n, HIDE);
      }
    }
  }
  tiles.instanceMatrix.needsUpdate = true;
  for (const sl of slatMeshes)           // catwalks over an unbuilt face are unbuilt too
    sl.mesh.visible = !CORNER_S.some((cs) =>
      sl.x1 >= cs && sl.x0 <= cs + CONFIG.path.faceTiles - 1);
}

// Settled-aware terrain queries: while a face is still unbuilt (columns
// hidden until its corner ritual slams them in), bullets and wasp floor
// checks must not collide with the invisible terrain — the face does not
// exist yet. Player collision never reaches past the corner clamp, and
// once a column locks (or the face commits) these degrade to the plain
// groundH queries.
function builtSolidAt(x, y) {
  const i = Math.floor(x);
  if (i >= 0 && i < LEVEL_LEN) {
    const col = columnInstances[i];
    if (col && !col.settled) return false;
  }
  return isSolid(i, Math.floor(y));
}

function builtGroundTopAt(x) {
  const i = Math.floor(x);
  if (i >= 0 && i < LEVEL_LEN) {
    const col = columnInstances[i];
    if (col && !col.settled) return -999;
  }
  return groundTopAt(x);
}

/* ======================== POOLS / WEAPONS ========================= */
/* Letter weapons R/S/L/H/F share one instanced pool; per-type behavior,
   scale, and color are set per projectile. Damage flows through hitHostile
   so kills credit the weapon (favorite-weapon stat).                  */

const bulletPool = [];
for (let i = 0; i < BULLET_MAX; i++) bulletPool.push({
  alive: false, x: 0, y: 0, vx: 0, vy: 0, dieAt: 0,
  type: 'R', damage: 1, pierce: false, crawling: false, dir: 1, hitSet: new Set(),
});

const bulletMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(CONFIG.rifle.radius, 6, 6),
  new THREE.MeshBasicMaterial({ color: 0xffffff }),
  BULLET_MAX
);
bulletMesh.frustumCulled = false;
scene.add(bulletMesh);
const _bm = new THREE.Matrix4();
const _bq = new THREE.Quaternion();
const _be = new THREE.Euler();
const _bs = new THREE.Vector3();
const _bv = new THREE.Vector3();
const _shotColor = new THREE.Color();
bulletMesh.setColorAt(0, _shotColor.setHex(0xffffff));   // allocates instanceColor up front
const slotType = new Array(BULLET_MAX).fill('');         // gate color uploads on change

let shotsFired = 0;
let currentWeapon = 'R';
// derived rosters: adding a weapon to CONFIG.weapons wires kills + drops
const WEAPON_LETTERS = Object.keys(CONFIG.weapons);
const weaponKills = Object.fromEntries(WEAPON_LETTERS.map(k => [k, 0]));

function weaponDef(letter) { return CONFIG.weapons[letter]; }

function spawnProj(type, x, y, dx, dy, def) {
  for (let i = 0; i < BULLET_MAX; i++) {
    const b = bulletPool[i];
    if (b.alive) continue;
    b.alive = true; b.type = type; b.x = x; b.y = y;
    b.vx = dx * def.speed; b.vy = dy * def.speed;
    b.damage = def.damage; b.pierce = !!def.pierce;
    b.dieAt = gameMs + def.lifeMs;
    b.crawling = false;
    b.dir = Math.sign(dx) || player.facing;
    b.hitSet.clear();
    if (slotType[i] !== type) {
      slotType[i] = type;
      bulletMesh.setColorAt(i, _shotColor.setHex(CONFIG.palette.shots[type]));
      bulletMesh.instanceColor.needsUpdate = true;
    }
    return;
  }
}

// One trigger pull → one "shot" for stats; clones replay without logging.
// No per-letter branches: count/splayDeg/lob fields on the def drive the fan.
function fireWeapon(letter, x, y, ax, ay, clone) {
  if (!clone) {
    shotsFired++;
    if (gameMs < mods.ghostUntil) logShot(letter, x, y, ax, ay);
  }
  const def = weaponDef(letter);
  if (def.lobBias !== undefined) ay = ay * def.lobScaleY + def.lobBias;   // flame lob
  const base = Math.atan2(ay, ax);
  const n = def.count || 1;
  const step = (def.splayDeg || 0) * DEG;
  for (let k = 0; k < n; k++) {
    const a = base + step * (k - (n - 1) / 2);
    spawnProj(letter, x, y, Math.cos(a), Math.sin(a), def);
  }
}

function killBullet(b, i) { b.alive = false; bulletMesh.setMatrixAt(i, HIDE); }

function updateBullets(dt) {
  const HDEF = CONFIG.weapons.H, FDEF = CONFIG.weapons.F;
  const YAWB = CONFIG.path.yawBlendTiles;
  for (let i = 0; i < BULLET_MAX; i++) {
    const b = bulletPool[i];
    if (!b.alive) { bulletMesh.setMatrixAt(i, HIDE); continue; }

    if (b.type === 'H') {                                // steer toward nearest live hostile
      let best = null, bestD = HDEF.seekRange * HDEF.seekRange;
      for (const e of hostiles) {
        if (gameMs < e.enterUntil) continue;
        const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = e; }
      }
      if (best) {
        const cur = Math.atan2(b.vy, b.vx);
        let diff = Math.atan2(best.y - b.y, best.x - b.x) - cur;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        const a = approach(cur, cur + diff, HDEF.turnRate * dt);
        b.vx = Math.cos(a) * HDEF.speed; b.vy = Math.sin(a) * HDEF.speed;
      }                                                  // integration happens in substeps below
    } else if (b.type === 'F' && !b.crawling) {
      b.vy += FDEF.dropAccel * dt;                       // gravity once per frame
    }

    // integrate + collide in SUBSTEPS: a clamped 50ms frame moves a laser
    // 2 tiles — far enough to cross a 1-wide pillar or a 0.55-radius
    // hostile between endpoint tests. Steps sized so no substep exceeds
    // ~0.45 units (capped at 4: worst case 0.5, still under both).
    const spd = b.crawling ? FDEF.crawlSpeed : Math.hypot(b.vx, b.vy);
    const steps = Math.min(4, Math.max(1, Math.ceil(spd * dt / 0.45)));
    const sdt = dt / steps;
    let gone = false;
    for (let k = 0; k < steps && !gone; k++) {
      if (b.type === 'F' && !b.crawling) {               // arc down to the deck…
        b.x += b.vx * sdt; b.y += b.vy * sdt;
        const g = builtGroundTopAt(b.x);
        if (g > -100 && b.y <= g + FDEF.hugY && b.vy <= 0) { b.crawling = true; b.y = g + FDEF.hugY; }
      } else if (b.type === 'F') {                       // …then crawl, hugging terrain
        b.x += b.dir * FDEF.crawlSpeed * sdt;
        const g = builtGroundTopAt(b.x);
        if (g > -100) b.y = approach(b.y, g + FDEF.hugY, FDEF.hugRate * sdt);
        else { gone = true; break; }                     // gap: fire dies
      } else {
        b.x += b.vx * sdt; b.y += b.vy * sdt;
      }

      if (b.crawling
          ? builtSolidAt(b.x + b.dir * FDEF.probeX, b.y + FDEF.probeY)   // crawler: tall walls only
          : builtSolidAt(b.x, b.y)) { gone = true; break; }

      for (let w = hostiles.length - 1; w >= 0; w--) {
        const e = hostiles[w];
        if (gameMs < e.enterUntil) continue;             // still materializing: no hitbox
        if (b.pierce && b.hitSet.has(e.id)) continue;
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < e.hitR * e.hitR) {
          if (b.pierce) b.hitSet.add(e.id);
          hitHostile(e, w, b.damage, b.type);
          if (!b.pierce) { gone = true; break; }
        }
      }
    }
    if (gone || gameMs > b.dieAt) { killBullet(b, i); continue; }

    // render: map (s,y) onto the tower. R/S/H are uniform-scale spheres, so
    // orientation is invisible — position + scale only, no yaw/quaternion
    // work. Only L (stretched bolt) and F (flattened crawler) compose.
    const bp = polyAt(SEGS, b.x, _pp);
    const def = CONFIG.weapons[b.type];
    if (b.type === 'L' || b.type === 'F') {
      _bs.fromArray(b.crawling ? def.crawlScale : def.scale);
      const yaw = yawAt(SEGS, b.x, YAWB);
      const ang = b.crawling ? 0 : Math.atan2(b.vy, b.vx);
      _bq.setFromEuler(_be.set(0, yaw, ang, 'YZX'));
      _bm.compose(_bv.set(bp.x, b.y, bp.z), _bq, _bs);
    } else {
      const s = def.scale[0];
      _bm.makeScale(s, s, s);
      _bm.setPosition(bp.x, b.y, bp.z);
    }
    bulletMesh.setMatrixAt(i, _bm);
  }
  bulletMesh.instanceMatrix.needsUpdate = true;
}

const P = CONFIG.player;
const player = {

  hw: P.width / 2, h: P.height,

  traversalCellX: 0, traversalTopY: 0,
  traversalSnapX: 0, traversalSnapY: 0,
  traversalUntil: 0, traversalRecatchUntil: 0, traversalEntryVx: 0,
  hp: P.maxHealth, lives: P.lives,
  iframesUntil: 0, hitstunUntil: 0,
  nextFireAt: 0,
};

const rig = new THREE.Group();

}
const gunGroup = new THREE.Group();
gunGroup.position.set(0, 1.05, 0.25);
const gun = new THREE.Mesh(
  new THREE.BoxGeometry(0.75, 0.14, 0.14),
  new THREE.MeshStandardMaterial({ color: CONFIG.palette.gun, flatShading: true })
);
gun.position.x = 0.45;
gunGroup.add(gun);
rig.add(gunGroup);
scene.add(rig);

function computeAim() {
  const h = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const v = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  if (h !== 0) player.facing = h;
  if (keys.strafe) return;                        // strafe-lock: aim frozen
  let ax, ay;
  if (h === 0 && v === 0)      { ax = player.facing; ay = 0; }
  else if (h === 0 && v > 0)   { ax = 0; ay = 1; }
  else if (h === 0 && v < 0)   { ax = player.grounded ? player.facing : 0; ay = -1; }
  else                         { ax = h; ay = v; }
  const n = Math.hypot(ax, ay);
  player.aim.set(ax / n, ay / n);
}

// circle vs the player's AABB — shared by contact damage and capsule pickup
function circleHitsPlayer(x, y, r) {
  const cx = Math.max(player.x - player.hw, Math.min(x, player.x + player.hw));
  const cy = Math.max(player.y, Math.min(y, player.y + player.h));
  return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
}

function playerOverlapsSolid() {
  const x0 = Math.floor(player.x - player.hw + 0.02), x1 = Math.floor(player.x + player.hw - 0.02);
  const y0 = Math.floor(player.y + 0.02), y1 = Math.floor(player.y + player.h - 0.02);
  for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) if (isSolid(i, j)) return true;
  return false;
}

const playerTraversalGeometry = {
  isSolid,
  minCellX: 1,
  maxCellX: LEVEL_LEN - 1,
  minPlayerX: -Infinity,
};

function clearPlayerTraversal(recatchUntil = player.traversalRecatchUntil) {
  player.traversalState = 'free';
  player.traversalSide = 0;
  player.traversalCellX = 0;
  player.traversalTopY = 0;
  player.traversalSnapX = 0;
  player.traversalSnapY = 0;
  player.traversalUntil = 0;
  player.traversalEntryVx = 0;
  player.traversalRecatchUntil = recatchUntil;
}

function updatePlayer(dt) {
  computeAim();

  const h = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let ledgeHanging = false;
  let wallSliding = false;

  // Contextual traversal launches happen before the ordinary jump branch so
  // they neither consume nor refill the player's remaining air jump.
  if (!IS_TRAVERSAL_SLICE && player.traversalState !== 'free') clearPlayerTraversal(0);
  if (IS_TRAVERSAL_SLICE && player.traversalState === 'ledge') {
    const action = traversalLedgeDecision({
      side: player.traversalSide,
      down: keys.down,
      jumpBuffered: jumpBufferedUntil > gameMs,
      entryVx: player.traversalEntryVx,
      now: gameMs,
      until: player.traversalUntil,
    }, P);
    if (action.kind === 'launch') {
      const side = player.traversalSide;
      const faceX = side > 0 ? player.traversalCellX : player.traversalCellX + 1;
      player.x = faceX + side * (player.hw + P.ledgeMantleInset);
      player.y = player.traversalTopY + 0.001;
      clearPlayerTraversal(action.recatchUntil);
      jumpBufferedUntil = 0;
      player.vx = action.vx; player.vy = action.vy;
      player.grounded = false; player.onOneWay = null;
      player.coyoteUntil = 0; player.jumpCutDone = false;
    } else if (action.kind === 'release') {
      const side = player.traversalSide;
      clearPlayerTraversal(action.recatchUntil);
      player.x -= side * P.ledgeReleaseNudge;
      player.vy = Math.min(player.vy, -0.01);
      player.jumpCutDone = true;
    } else {
      player.x = player.traversalSnapX;
      player.y = player.traversalSnapY;
      player.vx = 0; player.vy = 0;
      player.grounded = false; player.onOneWay = null;
      player.jumpCutDone = true;
      ledgeHanging = true;
    }
  } else if (IS_TRAVERSAL_SLICE && player.traversalState === 'wall') {
    const action = traversalWallDecision({
      side: player.traversalSide,
      cellX: player.traversalCellX,
      x: player.x, y: player.y, h: player.h,
      vy: player.vy, grounded: player.grounded,
      down: keys.down, hInput: h,
      jumpBuffered: jumpBufferedUntil > gameMs,
      now: gameMs, until: player.traversalUntil,
    }, playerTraversalGeometry, P);
    if (action.kind === 'jump') {
      clearPlayerTraversal(action.recatchUntil);
      jumpBufferedUntil = 0;
      player.vx = action.vx; player.vy = action.vy;
      player.grounded = false; player.onOneWay = null;
      player.coyoteUntil = 0; player.jumpCutDone = false;
    } else if (action.kind === 'release') {
      const side = player.traversalSide;
      clearPlayerTraversal(action.recatchUntil);
      player.x -= side * P.ledgeReleaseNudge;
    } else {
      player.x = player.traversalSnapX;
      player.vx = action.vx; player.vy = action.vy;
      wallSliding = true;
    }
  }

  // -- horizontal drive (locked out during hitstun and contextual contact)
  if (!ledgeHanging && !wallSliding && gameMs >= player.hitstunUntil) {
    const accel = player.grounded ? P.accelGround : P.accelAir;
    player.vx = approach(player.vx, h * P.runSpeed, accel * dt);
  }

  // -- jump: buffer + coyote + one air jump; down+jump on a catwalk = drop-through
  if (player.traversalState === 'free' && jumpBufferedUntil > gameMs) {
    if (player.grounded || player.coyoteUntil > gameMs) {
      jumpBufferedUntil = 0;
      if (player.grounded && player.onOneWay && keys.down) {
        player.dropUntil = gameMs + P.dropThroughMs;
        player.y -= 0.05;
        player.grounded = false;
      } else {
        player.vy = P.jumpVel;
        player.grounded = false;
        player.jumpCutDone = false;
        player.coyoteUntil = 0;
      }
    } else if (player.airJumpsLeft > 0) {
      jumpBufferedUntil = 0;
      player.airJumpsLeft--;
      if (IS_TRAVERSAL_SLICE) sliceStats.airJumps++;
      player.vy = P.airJumpVel;
      player.jumpCutDone = false;
    }
  }
  // variable jump height: releasing jump cuts upward velocity once
  if (!keys.jump && player.vy > 0 && !player.jumpCutDone) {
    player.vy *= P.jumpCutMult;
    player.jumpCutDone = true;
  }

  // -- gravity
  if (!ledgeHanging) {
    const g = P.gravity * (player.vy < 0 ? P.fallGravityMult : 1);
    player.vy = Math.max(P.terminalVel, player.vy + g * dt);
    if (wallSliding) player.vy = Math.max(player.vy, -P.wallSlideSpeed);
  }

  // -- integrate X, resolve against solids (dt clamp keeps moves < 1 tile)
  let wallHit = null;
  const collisionVx = player.vx;
  if (!ledgeHanging && !wallSliding) {
    player.x += player.vx * dt;
    if (player.vx > 0) {
      const ci = Math.floor(player.x + player.hw);
      for (let j = Math.floor(player.y + 0.02); j <= Math.floor(player.y + player.h - 0.02); j++) {
        if (isSolid(ci, j)) {
          player.x = ci - player.hw - 0.001; player.vx = 0;
          wallHit = { side: 1, cellX: ci, snapX: player.x };
          break;
        }
      }
    } else if (player.vx < 0) {
      const ci = Math.floor(player.x - player.hw);
      for (let j = Math.floor(player.y + 0.02); j <= Math.floor(player.y + player.h - 0.02); j++) {
        if (isSolid(ci, j)) {
          player.x = ci + 1 + player.hw + 0.001; player.vx = 0;
          wallHit = { side: -1, cellX: ci, snapX: player.x };
          break;
        }
      }
    }
  }

  // -- integrate Y, resolve against solids + one-way catwalks
  const prevY = player.y;
  const wasGrounded = player.grounded;
  if (!ledgeHanging) {
    player.y += player.vy * dt;
    player.grounded = false;
    player.onOneWay = null;
    if (player.vy <= 0) {
      const i0 = Math.floor(player.x - player.hw + 0.02), i1 = Math.floor(player.x + player.hw - 0.02);
      let landY = null, landPl = null;
      for (let j = Math.floor(prevY); j >= Math.floor(player.y); j--) {
        if (j + 1 > prevY + 0.001) continue;             // feet started below this surface
        if (isSolid(i0, j) || isSolid(i1, j)) { landY = j + 1; break; }
      }
      if (player.dropUntil <= gameMs) {
        for (const pl of platforms) {                    // stacked lanes: land on highest crossed
          if (player.x + player.hw > pl.x0 && player.x - player.hw < pl.x1 &&
              prevY >= pl.y - 0.001 && player.y <= pl.y &&
              (landY === null || pl.y > landY)) {
            landY = pl.y; landPl = pl;
          }
        }
      }
      if (landY !== null) {
        player.y = landY; player.vy = 0; player.grounded = true; player.onOneWay = landPl;
      }
    } else {
      const cj = Math.floor(player.y + player.h);
      const i0 = Math.floor(player.x - player.hw + 0.02), i1 = Math.floor(player.x + player.hw - 0.02);
      if (isSolid(i0, cj) || isSolid(i1, cj)) { player.y = cj - player.h - 0.001; player.vy = 0; }
    }
  }
  if (player.grounded) {
    clearPlayerTraversal();
    player.coyoteUntil = gameMs + P.coyoteMs;
    player.airJumpsLeft = P.airJumps;
  }
  if (!wasGrounded && player.grounded) player.jumpCutDone = true;

  // Falling near a real solid top catches before a lower wall slide. One-way
  // catwalks are intentionally absent because the probe only uses isSolid.
  if (IS_TRAVERSAL_SLICE && player.traversalState === 'free' &&
      !player.grounded && player.vy < 0) {
    playerTraversalGeometry.minPlayerX =
      sLeftEdge() + CONFIG.edges.margin + P.traversalEdgeGuard;
    const catchState = traversalLedgeProbe({
      x: player.x, y: player.y, hw: player.hw, h: player.h,
      vx: collisionVx, vy: player.vy, grounded: player.grounded,
      down: keys.down, hInput: wallHit ? wallHit.side : h,
      now: gameMs, recatchUntil: player.traversalRecatchUntil,
    }, playerTraversalGeometry, P);
    if (catchState) {
      player.traversalState = 'ledge';
      player.traversalSide = catchState.side;
      player.traversalCellX = catchState.cellX;
      player.traversalTopY = catchState.topY;
      player.traversalSnapX = catchState.snapX;
      player.traversalSnapY = catchState.snapY;
      player.traversalUntil = gameMs + P.ledgeHangMs;
      player.traversalEntryVx = collisionVx;
      player.x = catchState.snapX; player.y = catchState.snapY;
      player.vx = 0; player.vy = 0; player.jumpCutDone = true;
    } else if (wallHit && wallHit.cellX >= playerTraversalGeometry.minCellX &&
               wallHit.cellX < playerTraversalGeometry.maxCellX &&
               gameMs >= player.traversalRecatchUntil) {
      player.traversalState = 'wall';
      player.traversalSide = wallHit.side;
      player.traversalCellX = wallHit.cellX;
      player.traversalSnapX = wallHit.snapX;
      player.traversalUntil = gameMs + P.wallSlideMs;
      player.vy = Math.max(player.vy, -P.wallSlideSpeed);
      player.jumpCutDone = true;
    }
  }

  // -- frustum constraints: left edge is a damage plane that pushes.
  //    Crush damage is suspended while a corner gate/turn holds the scroll —
  //    the plane isn't advancing, so a pin there would be unfair jank.
  const le = sLeftEdge() + CONFIG.edges.margin;
  if (player.traversalState !== 'free' &&
      player.x - player.hw < le + P.traversalEdgeGuard) {
    clearPlayerTraversal(gameMs + P.traversalRecatchMs);
    player.vx = Math.max(player.vx, activeScrollSpeed());
  }
  if (player.x - player.hw < le) {
    player.x = le + player.hw;
    if (playerOverlapsSolid() && !cornerBusy()) damagePlayer(1, player.x - 1);   // crushed against terrain
  }
  //    Right clamp: while the active corner's face is still unbuilt, the
  //    pivot is the wall — the screen edge must not let the player walk
  //    onto hidden slam terrain (invisible floors and gaps past the corner).
  const ac = activeCorner();
  let re = sRightEdge() - CONFIG.edges.margin;
  if (ac) re = Math.min(re, ac.s + 1 - CONFIG.edges.margin);
  if (player.x + player.hw > re) player.x = re - player.hw;

  // -- fell into a gap
  if (IS_TRAVERSAL_SLICE) {
    sliceStats.minEdgeMargin = Math.min(
      sliceStats.minEdgeMargin,
      player.x - player.hw - sLeftEdge()
    );
  }

  if (player.y < CONFIG.edges.killY) { loseLife('fall'); return; }

  // -- fire (RAGE halves the interval)
  if (keys.fire && gameMs >= player.nextFireAt) {
    const def = weaponDef(currentWeapon);
    const rageMult = gameMs < mods.rageUntil ? CONFIG.mods.rageFireMult : 1;
    player.nextFireAt = gameMs + def.fireRateMs * rageMult;
    const a = player.aim;
    fireWeapon(currentWeapon, player.x + a.x * 0.6, player.y + 1.05 + a.y * 0.5, a.x, a.y, false);
  }

  // -- rig transform (s,y → tower world) + aim pose + i-frame flicker
  placeOnTower(rig, player.x, player.y, 0);
  gunGroup.rotation.z = Math.atan2(player.aim.y, player.aim.x);
  rig.visible = gameMs >= player.iframesUntil || blink();
}

function damagePlayer(amount, fromX) {
  if (gameMs < player.iframesUntil) return;
  clearPlayerTraversal(gameMs + P.traversalRecatchMs);
  jumpBufferedUntil = 0;
  player.hp -= amount;
  player.iframesUntil = gameMs + P.iframesMs;
  player.hitstunUntil = gameMs + P.hitstunMs;
  const away = Math.sign(player.x - fromX || 1);
  player.vx = away * P.knockbackX;
  player.vy = P.knockbackY;
  player.grounded = false;
  // classic tension: the weapon capsule pops out toward the threat —
  // recatch it within the window or fall back to the rifle
  if (currentWeapon !== 'R' && player.hp > 0) {
    spawnCapsule('letter', currentWeapon, player.x, player.y + 1.2, 'pop', -away * CAP.popVx);
    currentWeapon = 'R';
  }
  if (player.hp <= 0) loseLife('damage');
}

function scheduleSliceRetry(reason) {
  if (!IS_TRAVERSAL_SLICE || state === 'SLICE_RETRY') return;
  sliceStats.failures++;
  if (reason === 'fall') sliceStats.falls++;
  clearPlayerTraversal(0);
  jumpBufferedUntil = 0;
  releaseAllKeys();
  setState('SLICE_RETRY');
  sliceRetryTimer = setTimeout(() => {
    sliceRetryTimer = 0;
    if (state === 'SLICE_RETRY') resetGame();
  }, 650);
}

function loseLife(reason = 'damage') {
  clearPlayerTraversal(0);
  jumpBufferedUntil = 0;
  if (IS_TRAVERSAL_SLICE) {
    scheduleSliceRetry(reason);
    return;
  }
  player.lives--;
  currentWeapon = 'R';                     // death resets the arsenal
  clearMods();
  // ×3 on the HUD means three deaths total ends the run
  if (player.lives <= 0) { setState('GAME_OVER'); return; }
  respawn();
}

function respawn() {
  let i = Math.max(2, Math.ceil(sLeftEdge()) + 3);
  while (i < LEVEL_LEN - 2 && (groundH[i] < -100 || groundH[i + 1] < -100)) i++;
  player.x = i + 0.5;
  player.y = (groundH[i] > -100 ? groundH[i] : 3) + 4;   // drop in from above
  player.vx = 0; player.vy = 0;
  player.hp = P.maxHealth;
  player.iframesUntil = gameMs + 2000;
  player.hitstunUntil = 0;
  player.dropUntil = 0;
  player.coyoteUntil = 0;
  player.grounded = false; player.onOneWay = null; player.jumpCutDone = true;
  player.airJumpsLeft = P.airJumps;
  clearPlayerTraversal(0);
  jumpBufferedUntil = 0;
}

/* ===================== ENTITIES: HOSTILES ========================= */
/* Kinds: wasp drone, carrier. Roster pass adds polyp turret, houndframe,
   spore mortar as ENEMY rows + movement branches. */

const hostiles = [];
const waspGeo = new THREE.OctahedronGeometry(CONFIG.wasp.visualRadius);
const carrierGeo = new THREE.BoxGeometry(...CONFIG.carrier.size);
let kills = 0;
let hostileRng = mulberry32(5150);          // seeded: sim randomness is reproducible
let nextWaspId = 1;

// Per-kind stats resolved once at spawn — the roster pass adds kinds as rows
// here, not as ternaries at every use site. `gating: false` kinds never hold
// a wave gate closed (a slow hauler or future stationary emplacement parked
// near a corner must not deadlock the ritual).
const ENEMY = {
  wasp:    { geo: waspGeo,    color: CONFIG.palette.wasp,    hp: CONFIG.wasp.hp,
             hitR: CONFIG.wasp.contactRadius, gating: true },
  carrier: { geo: carrierGeo, color: CONFIG.palette.carrier, hp: CONFIG.carrier.hp,
             hitR: CONFIG.carrier.hitRadius, gating: false },
};

function spawnHostile(x, y, delayMs, kind) {
  kind = kind || 'wasp';
  const K = ENEMY[kind];
  const mat = new THREE.MeshStandardMaterial({
    color: K.color, flatShading: true, transparent: true, opacity: 0,
  });
  const mesh = new THREE.Mesh(K.geo, mat);
  mesh.visible = false;                    // hidden until its materialization begins
  scene.add(mesh);
  hostiles.push({
    id: nextWaspId++, kind,
    x, y, baseY: y, vx: 0, vy: 0, dir: -1, t: hostileRng() * 6,
    hp: K.hp, hitR: K.hitR,
    state: 'cruise', stateUntil: 0, diveCdUntil: 0,
    enterUntil: gameMs + (delayMs || 0) + CONFIG.wasp.enterMs,
    flashUntil: 0, mesh, mat,
  });
}

function removeHostile(idx, fade) {         // single removal path: gates count every exit
  const e = hostiles[idx];
  if (fade) {                            // hand the mesh to the corpse pass to dissolve
    corpses.push({ mesh: e.mesh, mat: e.mat, s: e.x, y: e.y, spin: e.t, t0: gameMs });
  } else {
    scene.remove(e.mesh);
    e.mat.dispose();
  }
  hostiles.splice(idx, 1);
  onHostileRemoved();
}

function hitHostile(e, idx, damage, weapon) {
  e.hp -= damage;
  e.flashUntil = gameMs + 70;
  if (e.hp <= 0) {
    kills++;
    if (weaponKills[weapon] !== undefined) weaponKills[weapon]++;
    if (e.kind === 'carrier') dropFromCarrier(e.x, e.y);
    removeHostile(idx, true);
  }
}

// Dead hostiles are display-only: no sim, no gate participation (removeHostile
// already fired onHostileRemoved), just the dissolve back into tower depth.
const corpses = [];
function updateCorpses() {
  const W = CONFIG.wasp;
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    const u = (gameMs - c.t0) / W.dieMs;
    if (u >= 1) { scene.remove(c.mesh); c.mat.dispose(); corpses.splice(i, 1); continue; }
    placeOnTower(c.mesh, c.s, c.y - 0.6 * u, W.dieDepth * u * u);   // recede into the dark
    c.mesh.rotation.z = c.spin + u * 9;           // death tumble
    c.mesh.scale.setScalar(1 + 0.3 * u);
    c.mat.opacity = 1 - u * u;
    c.mat.emissive.setHex(u < 0.16 ? 0xffffff : 0x000000);   // death pop, then dissolve
  }
}

function updateHostiles(dt) {
  const W = CONFIG.wasp;
  const GW = CONFIG.waves;
  const gate = gateActive();
  const diveRange = gate ? GW.gateDiveRange : W.diveRange;         // gated hostiles press harder
  const diveCooldown = gate ? GW.gateDiveCooldownMs : W.diveCooldownMs;
  const cullX = sLeftEdge() - 8;
  // Patrol right bound: the frozen screen edge reaches ~12 tiles past the
  // corner pivot, so bounding on the edge alone let hostiles drift around
  // the corner onto the next face — foreshortened, clustered, idling. The
  // arena ends at the pivot; nobody fights around a corner that isn't
  // built yet.
  const patrolR = gate ? Math.min(sRightEdge() - 2, activeCorner().s - 1.5) : 0;
  const patrolL = gate ? sLeftEdge() + 2 : 0;
  for (let i = hostiles.length - 1; i >= 0; i--) {
    const e = hostiles[i];
    if (gameMs < e.enterUntil - W.enterMs) {           // staged wave slot: not yet condensing
      e.mesh.visible = false;
      continue;
    }
    e.mesh.visible = true;
    e.t += dt;
    if (gate) {                                        // patrol box: nobody strands the gate
      if (e.x < patrolL) e.dir = 1;
      else if (e.x > patrolR) e.dir = -1;
    }
    if (e.kind === 'carrier') {                        // slow hauler: cruise only, never dives
      const C = CONFIG.carrier;
      e.x += e.dir * C.speed * dt;
      e.y = e.baseY + Math.sin(e.t * C.bobFreq) * C.bobAmp;
    } else if (e.state === 'cruise') {
      e.x += e.dir * (gate ? GW.gateCruiseSpeed : W.cruiseSpeed) * dt;
      e.y = e.baseY + Math.sin(e.t * W.bobFreq) * W.bobAmp;
      if (Math.abs(e.x - player.x) < diveRange && player.y + 1 < e.y &&
          gameMs > e.diveCdUntil && gameMs >= e.enterUntil) {   // no ghost dives mid-materialize
        const tx = player.x - e.x, ty = (player.y + 0.9) - e.y;
        const n = Math.hypot(tx, ty) || 1;
        e.vx = tx / n * W.diveSpeed; e.vy = ty / n * W.diveSpeed;
        e.state = 'dive';
        e.stateUntil = gameMs + W.diveMs;
      }
    } else if (e.state === 'dive') {
      e.x += e.vx * dt; e.y += e.vy * dt;
      const floor = builtGroundTopAt(e.x);       // hidden faces have no floor yet
      if (gameMs > e.stateUntil || e.y < floor + 0.4) {
        e.state = 'recover';
        e.diveCdUntil = gameMs + diveCooldown;
      }
    } else {                                             // recover: climb back up
      e.x -= 1.2 * dt;
      if (gate) e.x = Math.max(e.x, sLeftEdge() + 1);    // no drifting out of the fight
      e.y = approach(e.y, e.baseY, 5 * dt);
      if (Math.abs(e.y - e.baseY) < 0.05) { e.state = 'cruise'; e.t = 0; }
    }

    if (e.x < cullX) {
      removeHostile(i);
      continue;
    }

    // contact damage — only once fully materialized (hitR doubles as contact radius)
    if (gameMs >= e.enterUntil && circleHitsPlayer(e.x, e.y, e.hitR)) damagePlayer(1, e.x);

    // mock-3D presence: materialize in from tower depth, breathe while alive
    let depth, scale;
    if (gameMs < e.enterUntil) {
      const u = 1 - (e.enterUntil - gameMs) / W.enterMs;    // 0 → 1 over the entrance
      const ease = 1 - (1 - u) ** 3;
      depth = W.enterDepth * (1 - ease);
      scale = 0.7 + 0.3 * ease;
      e.mat.opacity = u;
    } else {
      depth = Math.sin(e.t * W.wobbleFreq) * W.wobbleAmp;
      scale = 1;
      e.mat.opacity = 1;
    }
    e.mat.emissive.setHex(gameMs < e.flashUntil ? 0xffffff : 0x000000);
    placeOnTower(e.mesh, e.x, e.y, depth);
    e.mesh.rotation.z = e.kind === 'carrier'
      ? Math.sin(e.t * CONFIG.carrier.rollFreq) * CONFIG.carrier.rollAmp
      : e.t * 2;
    e.mesh.scale.setScalar(scale);
  }
}

/* ================= ENTITIES: CAPSULES (PICKUPS) =================== */
/* Letter capsules drift from destroyed carriers; on taking a hit the
   current weapon pops out and can be recaught for ~2.2s before it burns
   away. Modifier capsules (gold) are rare late-run carrier drops.      */

const capsules = [];
const CAP = CONFIG.capsules;
const capsuleGeo = new THREE.BoxGeometry(CAP.size, CAP.size, CAP.size);   // shared: never disposed
const letterTexCache = {};

function letterTexture(text, bg) {
  const key = text + '|' + bg;
  if (letterTexCache[key]) return letterTexCache[key];
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = bg;
  g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#14181e';
  g.font = 'bold ' + (text.length > 1 ? 30 : 42) + 'px monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 32, 35);
  const tex = new THREE.CanvasTexture(cv);
  letterTexCache[key] = tex;
  return tex;
}

// mode 'drift': flies from a killed carrier, sinks slowly toward catch height.
// mode 'pop': knocked out of the player, lands, expires after the recatch window.
// mode 'fixed': authored dare-pocket reward; bobs in place until collected.
function spawnCapsule(kind, letter, x, y, mode, vx) {
  const bg = kind === 'mod' ? CONFIG.palette.modCapsule : CONFIG.palette.capsule;
  const mat = new THREE.MeshBasicMaterial({ map: letterTexture(letter, bg) });
  const mesh = new THREE.Mesh(capsuleGeo, mat);
  scene.add(mesh);
  capsules.push({
    kind, letter, x, y, baseY: y, vx: vx || 0, vy: mode === 'pop' ? CAP.popVy : 0,
    mode, dieAt: mode === 'pop' ? gameMs + CAP.recatchMs : 0, t: 0, mesh, mat,
  });
}

function removeCapsule(i) {
  const c = capsules[i];
  scene.remove(c.mesh);
  c.mat.dispose();
  capsules.splice(i, 1);
}

// Carrier drop order: seeded shuffle of the four letters, then rare
// modifiers. Deterministic run to run.
const capsuleRng = mulberry32(2600);
function shuffled(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const letterDrops = shuffled(WEAPON_LETTERS.filter(k => k !== 'R'), capsuleRng);
const modDrops = shuffled(['RG', 'GS', 'OL', 'CH'], capsuleRng);
let carrierDropIdx = 0;

function dropFromCarrier(x, y) {
  const i = carrierDropIdx++;
  if (i < letterDrops.length) spawnCapsule('letter', letterDrops[i], x, y, 'drift');
  else spawnCapsule('mod', modDrops[(i - letterDrops.length) % modDrops.length], x, y, 'drift');
}

function updateCapsules(dt) {
  for (let i = capsules.length - 1; i >= 0; i--) {
    const c = capsules[i];
    c.t += dt;
    if (c.mode === 'drift') {
      c.x -= CAP.driftSpeed * dt;
      const g = builtGroundTopAt(c.x);
      const floorY = (g > -100 ? g : 2) + 1.5;
      c.baseY = Math.max(c.baseY - CAP.sinkSpeed * dt, floorY);
      c.y = c.baseY + Math.sin(c.t * CAP.bobFreq) * CAP.bobAmp;
      if (c.x < sLeftEdge() - 4) { removeCapsule(i); continue; }
    } else if (c.mode === 'pop') {
      c.vy += CAP.gravity * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      const g = builtGroundTopAt(c.x);
      if (g > -100 && c.y <= g + 0.3 && c.vy < 0) { c.y = g + 0.3; c.vy = 0; c.vx *= 0.8; }
      if (c.y < CONFIG.edges.killY || gameMs > c.dieAt) { removeCapsule(i); continue; }
    } else {
      c.y = c.baseY + Math.sin(c.t * CAP.bobFreq) * CAP.bobAmp * 0.3;
    }

    if (circleHitsPlayer(c.x, c.y, CAP.pickupRadius)) {
      if (c.kind === 'mod') applyMod(c.letter);
      else currentWeapon = c.letter;
      removeCapsule(i);
      continue;
    }

    // expiring pop-capsules blink through their last stretch
    c.mesh.visible = c.mode !== 'pop' || c.dieAt - gameMs > CAP.blinkLastMs || blink();
    placeOnTower(c.mesh, c.x, c.y, 0);
    c.mesh.rotation.y += c.t * 2.2;               // pickup twirl on top of face yaw
  }
}

/* ======================== MODIFIERS (RARE) ======================== */
/* RAGE 2× fire rate · GHOST SQUAD delayed clone fire · ORBITAL LANCE
   telegraphed screen clear · CHRONO world slow. Stackable, timed.     */

const mods = { rageUntil: 0, ghostUntil: 0, chronoUntil: 0, lance: null, lanceFlashUntil: 0 };
const shotLog = [];                       // ghost squad: shots awaiting replay
const posLog = [];                        // ghost squad: player position trail
// both buffers must outlive the longest clone delay or the trail lookup
// snaps to a stale sample — derived, so retuning ghostDelayMs cannot drift
const GHOST_TRAIL_MS = Math.max(...CONFIG.mods.ghostDelayMs) + 300;

const cloneMeshes = CONFIG.mods.ghostDelayMs.map(() => {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 1.5, 0.4),
    new THREE.MeshBasicMaterial({ color: CONFIG.palette.player, transparent: true, opacity: 0.32 })
  );
  m.visible = false;
  scene.add(m);
  return m;
});

const lanceBeam = new THREE.Mesh(
  new THREE.BoxGeometry(0.35, 16, 0.35),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
);
lanceBeam.visible = false;
scene.add(lanceBeam);

function applyMod(code) {
  const M = CONFIG.mods;
  if (code === 'RG') mods.rageUntil = gameMs + M.rageMs;
  else if (code === 'GS') mods.ghostUntil = gameMs + M.ghostMs;
  else if (code === 'CH') mods.chronoUntil = gameMs + M.chronoMs;
  else if (code === 'OL') mods.lance = { s: player.x, at: gameMs + M.lanceTelegraphMs };
}

function logShot(letter, x, y, ax, ay) {
  shotLog.push({ t: gameMs, letter, x, y, ax, ay, fired: CONFIG.mods.ghostDelayMs.map(() => false) });
  if (shotLog.length > 80) shotLog.shift();   // >> ghostMs / min fireRateMs would ever produce
}

// full modifier teardown — the ONLY reset path, shared by loseLife/resetGame
function clearMods() {
  mods.rageUntil = 0; mods.ghostUntil = 0; mods.chronoUntil = 0;
  mods.lance = null; mods.lanceFlashUntil = 0;
  lanceBeam.visible = false;
  for (const cm of cloneMeshes) cm.visible = false;
  shotLog.length = 0; posLog.length = 0;
  tintEl.style.background = 'transparent'; tintLast = 'transparent';
}

function updateMods() {
  const M = CONFIG.mods;

  // ghost squad: clones trail the player and replay logged shots late.
  // Inactive: buffers stay empty — no trail bookkeeping for a rare mod.
  if (gameMs >= mods.ghostUntil) {
    if (posLog.length) {
      for (const cm of cloneMeshes) cm.visible = false;
      shotLog.length = 0; posLog.length = 0;
    }
  } else {
    posLog.push({ t: gameMs, x: player.x, y: player.y });
    while (posLog.length && posLog[0].t < gameMs - GHOST_TRAIL_MS) posLog.shift();
    for (let d = 0; d < M.ghostDelayMs.length; d++) {
      const delay = M.ghostDelayMs[d];
      for (const s of shotLog) {
        if (!s.fired[d] && gameMs >= s.t + delay) {
          s.fired[d] = true;
          fireWeapon(s.letter, s.x, s.y, s.ax, s.ay, true);
        }
      }
      const cm = cloneMeshes[d];
      cm.visible = true;
      let p = posLog[0];
      for (const q of posLog) { if (q.t <= gameMs - delay) p = q; else break; }
      placeOnTower(cm, p.x, p.y + 0.85, 0);
    }
    while (shotLog.length && shotLog[0].t + GHOST_TRAIL_MS < gameMs && shotLog[0].fired.every(Boolean))
      shotLog.shift();
  }

  // orbital lance: telegraph beam, then the strike clears every hostile
  if (mods.lance) {
    const L = mods.lance;
    lanceBeam.visible = true;
    placeOnTower(lanceBeam, L.s, 8, 0);
    lanceBeam.material.opacity = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(gameMs / 40));
    if (gameMs >= L.at) {
      for (let i = hostiles.length - 1; i >= 0; i--) hitHostile(hostiles[i], i, 999, 'OL');
      mods.lanceFlashUntil = gameMs + M.lanceFlashMs;
      mods.lance = null;
      lanceBeam.visible = false;
    }
  }

  // screen tint: lance flash > rage red > chrono blue
  const T = CONFIG.palette.tints;
  let tint = 'transparent';
  if (gameMs < mods.lanceFlashUntil) tint = T.lance;
  else if (gameMs < mods.rageUntil) tint = T.rage;
  else if (gameMs < mods.chronoUntil) tint = T.chrono;
  if (tint !== tintLast) { tintLast = tint; tintEl.style.background = tint; }
}

/* ============================ SPAWNER ============================= */
/* Spawn director: data array keyed to scroll distance, built by the pure
   generator — density authored in seconds of scroll (scales with
   scrollSpeed), escalating per face along with the wingman pair chance.
   Roster pass extends entries with more types; this is the final
   mechanism. Corner zones are kept clean — gate waves are authored by
   the wave system, never by the ambient table. */

const spawnTable = IS_TRAVERSAL_SLICE ? [] : buildSpawnTable(CONFIG);
let spawnIdx = 0;
let spawnRng = mulberry32(9001);

// helper shared by every spawn site: lane altitude over local ground,
// gap-safe, capped so hostiles stay in the fightable band
function spawnLaneY(s, lane, cap = 10) {
  const base = groundTopAt(s);
  return Math.min((base > -100 ? base : 3) + lane, cap);
}

function updateSpawner() {
  if (IS_TRAVERSAL_SLICE) return;         // fixture spawns are authored per attempt
  if (cornerBusy()) return;              // gates author their own waves; on wide
                                         //   aspect ratios the halted look-ahead
                                         //   would otherwise reach past the
                                         //   corner-clear zone and drop ambient
                                         //   hostiles onto the unbuilt face
  // Trigger once the entry sits just INSIDE the view, so its materialization
  // happens on screen instead of completing past the right edge.
  const re = sRightEdge();
  while (spawnIdx < spawnTable.length && spawnTable[spawnIdx].x < re - 1.5) {
    const s = spawnTable[spawnIdx++];
    if (s.type === 'carrier') {
      spawnHostile(s.x, spawnLaneY(s.x, CONFIG.carrier.laneAbove), 0, 'carrier');
    } else {
      const r = spawnRng();
      const lane = r < 0.45 ? 2.6 : r < 0.8 ? 4.6 : 7.2;   // low / mid / high tier
      spawnHostile(s.x, spawnLaneY(s.x, lane + spawnRng() * 0.8));
    }
  }
}

/* ====================== WAVES: GATE RUNTIME ======================= */
/* Scroll halts at each corner until the wave is cleared; the killing
   shot triggers the corner ritual — wind-up, two yaw snaps with a
   ratchet hold, brick-slam zipper building the next face — then the
   scroll eases back in. Byte-identical at all six corners. */

const cornerEvents = CORNER_S.map((s, i) => ({ s, k: i + 1, state: 'idle', tStart: 0 }));

function activeCorner() {                // first corner not yet completed
  if (IS_TRAVERSAL_SLICE) return null;    // fixture rejoins before corner machinery
  for (const c of cornerEvents) if (c.state !== 'done') return c;
  return null;
}

function gateActive() {
  const c = activeCorner();
  return !!c && c.state === 'gate';
}

function cornerBusy() {                  // gate fight or turning: scroll is held
  const c = activeCorner();
  return !!c && (c.state === 'gate' || c.state === 'turning');
}

function armGate(c) {
  c.state = 'gate';
  spawnGateWave(c.k);
}

function spawnGateWave(k) {              // deterministic: no rng in wave layout
  const W = CONFIG.waves;
  const n = waveSize(k, CONFIG);
  // Materialize IN the arena: the view is frozen during a gate, so the wave
  // condenses out of the tower depth in front of the player — staggered
  // right-to-left, one presence at a time. Placement is bounded by the real
  // (aspect-corrected) view edges and never crosses onto the unbuilt face,
  // so this is safe at any window shape.
  const pivot = CORNER_S[k - 1];
  const right = Math.min(sRightEdge() - 2, pivot - 2);
  const left = Math.min(sLeftEdge() + 6, right - 4);
  const span = Math.max(right - left, 4);
  for (let i = 0; i < n; i++) {
    const f = n === 1 ? 0 : i / (n - 1);
    const sx = right - f * span;
    const lane = waveLane(k, i, CONFIG);       // authored altitude mix per wave
    spawnHostile(sx, spawnLaneY(sx, lane), i * W.staggerMs);
  }
}

// Event-driven clear: called from every wasp removal path, so the ritual
// starts on the exact frame the last hostile dies — the snap IS the stinger.
function onHostileRemoved() {
  const c = activeCorner();
  if (c && c.state === 'gate' && !hostiles.some(e => ENEMY[e.kind].gating)) {
    c.state = 'turning';
    c.tStart = gameMs;
  }
}

function finishCorner(c) {
  updateZipper(c, 1e9);                  // lock every slam column to base
  revealFaceRest(c);                     // rest of the face commits, fog-covered
  c.state = 'done';
  camYawBase += 2 * CONFIG.path.turnDeg * DEG * CONFIG.path.turnSign;
  camYaw = camYawBase;
}

function revealFaceRest(c) {             // beyond the zipper strip: one distant commit
  for (const s of farSets[c.k - 1]) {
    const col = columnInstances[s];
    if (!col || col.settled) continue;
    col.settled = true;
    for (let n = 0; n < col.count; n++)
      tiles.setMatrixAt(col.start + n, tileBaseMats[col.start + n]);
  }
  tiles.instanceMatrix.needsUpdate = true;
  const faceEnd = c.s + CONFIG.path.faceTiles - 1;
  for (const sl of slatMeshes)           // this face's catwalks come back with it
    if (sl.x1 >= c.s && sl.x0 <= faceEnd) sl.mesh.visible = true;
}

const _zm = new THREE.Matrix4();
function updateZipper(c, tMs) {          // near-to-far brick slam of the next face
  const cols = slamSets[c.k - 1];
  let touched = false;
  for (let j = 0; j < cols.length; j++) {
    const col = columnInstances[cols[j]];
    if (!col || col.settled) continue;   // gap column, or already locked
    const z = zipperOffset(tMs, j, CONFIG);
    if (z.phase === 'hidden') continue;
    for (let n = 0; n < col.count; n++) {
      const inst = col.start + n;
      _zm.copy(tileBaseMats[inst]);
      _zm.elements[13] += z.dy;
      tiles.setMatrixAt(inst, _zm);
    }
    if (z.phase === 'locked') col.settled = true;
    touched = true;
  }
  if (touched) tiles.instanceMatrix.needsUpdate = true;
}

/* ============================== FX ================================ */
/* Juice pass: trauma shake, hit-stop, muzzle lights, particles,
   tracers, squash-and-stretch. Intentionally empty in grey-box. */

/* ============================= AUDIO ============================== */
/* Audio pass: WebAudio-synthesized SFX + generative bass loop.
   Intentionally empty in grey-box. */

/* =============================== UI =============================== */

const tintEl = document.getElementById('tint');
let tintLast = 'transparent';
const hudTL = document.getElementById('hudTL');
const hudTC = document.getElementById('hudTC');
const hudTR = document.getElementById('hudTR');
const hudBL = document.getElementById('hudBL');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovBody = document.getElementById('ovBody');

hudBL.innerHTML = IS_TRAVERSAL_SLICE
  ? 'MOVE wasd/arrows &nbsp; JUMP space &nbsp; FIRE j or x &nbsp; RETRY r<br>' +
    'LEDGE near-misses catch: jump launches, down releases &nbsp;&middot;&nbsp; WALL contact: jump launches, down releases<br>' +
    'MAGENTA POCKET = optional wager &nbsp;&middot;&nbsp; PAUSE p/esc'
  : 'MOVE wasd/arrows &nbsp; JUMP space (hold = higher, again in air = double) &nbsp; FIRE j or x<br>' +
    'AIM 8-way via move keys &nbsp; STRAFE-LOCK shift &nbsp; DROP down+jump on catwalks<br>' +
    'CAPSULES swap weapons &middot; hit = weapon pops out, recatch it fast &nbsp;&middot;&nbsp; PAUSE p/esc';

// updateHUD runs every rAF frame; assigning textContent replaces the text
// node even when identical, dirtying layout for three fixed elements 60x/s.
// Cache the last-written string per element and write only on change — in
// steady state DOM writes drop to near zero.
let hudTLLast = null, hudTCLast = null, hudTRLast = null;
const MOD_LABELS = [['rageUntil', 'RAGE'], ['ghostUntil', 'GHOST'], ['chronoUntil', 'CHRONO']];

function updateHUD() {
  const hp = Math.max(0, player.hp);
  let tl = 'RIG ' + '▰'.repeat(hp) + '▱'.repeat(P.maxHealth - hp) +
           (IS_TRAVERSAL_SLICE ? '' : '  ×' + Math.max(0, player.lives)) +
           '  ·  [' + currentWeapon + '] ' + weaponDef(currentWeapon).name;
  for (const [f, label] of MOD_LABELS)
    if (gameMs < mods[f]) tl += ' · ' + label + ' ' + Math.ceil((mods[f] - gameMs) / 1000) + 's';
  if (mods.lance) tl += ' · LANCE ARMING';
  if (tl !== hudTLLast) { hudTLLast = tl; hudTL.textContent = tl; }
  const edge = Number.isFinite(sliceStats.minEdgeMargin)
    ? Math.max(0, sliceStats.minEdgeMargin).toFixed(1)
    : '—';
  const tr = IS_TRAVERSAL_SLICE
    ? `ATTEMPT ${sliceStats.attempts} · EDGE ${edge} · ${kills} kills`
    : Math.floor(scrollX) + 'm  ·  ' + kills + ' kills';
  if (tr !== hudTRLast) { hudTRLast = tr; hudTR.textContent = tr; }
  const c = activeCorner();
  let tc = '';
  if (IS_TRAVERSAL_SLICE && gameMs - sliceStats.startedAt < 2400) {
    tc = 'TRAVERSAL SLICE · ' +
      (SLICE_ENEMIES_ENABLED ? ACTIVE_SLICE.enemies.length + ' WASPS' : 'MOVEMENT ONLY');
  } else if (c && c.state === 'gate') {
    let gaters = 0;
    for (const e of hostiles) if (ENEMY[e.kind].gating) gaters++;
    tc = 'WAVE ' + c.k + '/' + CONFIG.path.faces + ' — ' + gaters + ' HOSTILES';
  } else if (c && c.state === 'turning' && gameMs - c.tStart < CONFIG.waves.clearMsgMs) {
    tc = 'CLEAR';
  }
  if (tc !== hudTCLast) { hudTCLast = tc; hudTC.textContent = tc; }
}

function favoriteWeaponLine() {
  let best = 'R';
  for (const k of Object.keys(weaponKills)) if (weaponKills[k] > weaponKills[best]) best = k;
  return `favorite weapon: ${weaponDef(best).name} (${weaponKills[best]} kills)`;
}

function showOverlay(title, lines) {
  ovTitle.textContent = title;
  ovBody.innerHTML = lines.map(l => `<p${l.dim ? ' class="dim"' : ''}>${l.text}</p>`).join('');
  overlay.style.display = 'flex';
}
function hideOverlay() { overlay.style.display = 'none'; }

/* ============================= STATES ============================= */
/* Full machine: BOOT → MENU → PLAYING → PAUSED/SLICE_RETRY → GAME_OVER/VICTORY.
   Grey-box boots straight into PLAYING; MENU arrives with the UI pass. */

let state = 'BOOT';

function setState(next) {
  state = next;
  if (next === 'PLAYING') hideOverlay();
  else if (next === 'PAUSED') showOverlay('PAUSED', [{ text: 'p / esc to resume', dim: true }]);
  else if (next === 'SLICE_RETRY') showOverlay('ROUTE LOST', [
    { text: 'resetting traversal fixture…', dim: true },
    { text: 'r to retry now', dim: true },
  ]);
  else if (next === 'GAME_OVER') showOverlay('SIGNAL LOST', [
    { text: `${Math.floor(scrollX)}m · ${kills} kills · ${shotsFired} shots` },
    { text: favoriteWeaponLine() },
    { text: 'r to restart', dim: true },
  ]);
  else if (next === 'VICTORY') {
    if (IS_TRAVERSAL_SLICE) {
      const elapsed = Math.max(0, (gameMs - sliceStats.startedAt) / 1000).toFixed(1);
      const edge = Number.isFinite(sliceStats.minEdgeMargin)
        ? Math.max(0, sliceStats.minEdgeMargin).toFixed(1)
        : '—';
      showOverlay('TRAVERSAL CLEAR', [
        { text: `${elapsed}s · ${kills} kills · ${sliceStats.airJumps} air jumps` },
        { text: `closest damage-edge margin: ${edge} tiles` },
        { text: `attempt ${sliceStats.attempts} · ${sliceStats.falls} total falls` },
        { text: 'r to replay', dim: true },
      ]);
    } else {
      showOverlay('SECTOR CLEAR', [
        { text: 'grey-box complete' },
        { text: `${Math.floor(scrollX)}m · ${kills} kills · ${shotsFired} shots` },
        { text: favoriteWeaponLine() },
        { text: 'r to restart', dim: true },
      ]);
    }
  }
}

function togglePause() {
  if (state === 'PLAYING') setState('PAUSED');
  else if (state === 'PAUSED') setState('PLAYING');
}

function resetGame() {
  if (sliceRetryTimer) {
    clearTimeout(sliceRetryTimer);
    sliceRetryTimer = 0;
  }
  releaseAllKeys();
  for (const e of hostiles) { scene.remove(e.mesh); e.mat.dispose(); }
  hostiles.length = 0;
  for (const c of corpses) { scene.remove(c.mesh); c.mat.dispose(); }
  corpses.length = 0;
  for (const b of bulletPool) b.alive = false;
  for (let i = capsules.length - 1; i >= 0; i--) removeCapsule(i);
  currentWeapon = 'R';
  for (const k of Object.keys(weaponKills)) weaponKills[k] = 0;
  clearMods();
  carrierDropIdx = 0;
  scrollX = ACTIVE_SLICE ? ACTIVE_SLICE.run.startScroll : 0;
  spawnIdx = 0;
  spawnRng = mulberry32(9001);
  hostileRng = mulberry32(5150);
  kills = 0; shotsFired = 0;
  player.x = ACTIVE_SLICE ? ACTIVE_SLICE.run.playerSpawn.x : 6;
  player.y = ACTIVE_SLICE ? ACTIVE_SLICE.run.playerSpawn.y : 3;
  player.vx = 0; player.vy = 0;
  player.hp = P.maxHealth; player.lives = P.lives;
  player.facing = 1; player.aim.set(1, 0);
  player.iframesUntil = 0; player.hitstunUntil = 0;
  player.coyoteUntil = 0; player.dropUntil = 0; player.nextFireAt = 0;
  player.grounded = false; player.onOneWay = null; player.jumpCutDone = true;
  player.airJumpsLeft = P.airJumps;
  clearPlayerTraversal(0);
  jumpBufferedUntil = 0;
  for (const c of cornerEvents) { c.state = 'idle'; c.tStart = 0; }
  camYaw = 0; camYawBase = 0;
  hideAllSlamColumns();
  if (ACTIVE_SLICE) {
    sliceStats.attempts++;
    sliceStats.airJumps = 0;
    sliceStats.minEdgeMargin = Infinity;
    sliceStats.startedAt = gameMs;
    const reward = ACTIVE_SLICE.darePocket.reward;
    spawnCapsule(reward.kind, reward.letter, reward.x, reward.y, reward.mode);
    if (SLICE_ENEMIES_ENABLED) {
      for (const e of ACTIVE_SLICE.enemies)
        spawnHostile(e.x, e.y, e.delayMs, e.kind);
    }
  }
  hudTC.textContent = '';
  hudTCLast = '';                        // keep the HUD write cache coherent
  updateCamera(0);
  setState('PLAYING');
}

/* =========================== MAIN LOOP ============================ */

let camYaw = 0;                 // render yaw (radians); animated by corner events
let camYawBase = 0;             // face heading after all completed corners
const _look = new THREE.Vector3();

function updateCamera(dt) {
  const c = activeCorner();
  if (c && c.state === 'turning') {
    const t = gameMs - c.tStart;
    scrollX = Math.min(scrollX + cornerScrollVel(t, CONFIG) * dt, activeScrollEnd());
    camYaw = camYawBase + cornerYawDeltaDeg(t, CONFIG) * DEG * CONFIG.path.turnSign;
    updateZipper(c, t);
    if (t >= cornerEventTotalMs(CONFIG)) finishCorner(c);
  } else {
    let target = activeScrollEnd();                     // wave-gate / fixture clamp
    if (c) target = Math.min(target, HALT_S[c.k - 1]);
    scrollX = Math.min(scrollX + activeScrollSpeed() * dt, target);
    camYaw = camYawBase;
    if (c && c.state === 'idle' && scrollX >= HALT_S[c.k - 1] - 1e-6) armGate(c);
  }

  // chamfered camera path: anchor rides the polyline; yaw is ritual-driven
  const C = CONFIG.camera;
  const a = polyAt(SEGS, scrollX, _pp);
  const fx = Math.cos(camYaw), fz = -Math.sin(camYaw);   // fwd along the face
  const rx = -fz, rz = fx;                               // right = fwd × up
  camera.position.set(a.x + fx * C.x + rx * C.z, C.y, a.z + fz * C.x + rz * C.z);
  _look.set(a.x + fx * C.lookX, C.lookY, a.z + fz * C.lookX);
  camera.lookAt(_look);
  camera.updateMatrixWorld();
}

function update(dt) {
  gameMs += dt * 1000;
  // CHRONO: the world runs slow, the player (and their bullets) run full
  // speed. Timers stay on real gameMs — a 4s window keeps the drift small.
  const wScale = gameMs < mods.chronoUntil ? CONFIG.mods.chronoScale : 1;
  updateCamera(dt * wScale);
  updateSpawner();
  updatePlayer(dt);
  if (state !== 'PLAYING') return;      // died on the last frame
  updateHostiles(dt * wScale);
  updateCorpses();
  updateCapsules(dt * wScale);
  updateMods();
  updateBullets(dt);
  if (IS_TRAVERSAL_SLICE) {
    if (player.x >= ACTIVE_SLICE.rejoin.x0) setState('VICTORY');
  } else if (scrollX >= END_SCROLL) {
    setState('VICTORY');
  }
}

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, t - last) / 1000;
  last = t;
  if (state === 'PLAYING') update(dt);
  renderer.render(scene, camera);
  updateHUD();
}

calibrateEdges();
/* =========================== SELF-TEST ============================ */
/* Open index.html?selftest=1: after 1.5s of normal play the page runs a
   boot smoke — render loop alive, pause/resume, resize, restart — and
   reports SELFTEST PASS/FAIL to the console AND the page title, so both
   a human and an automated tab can read the verdict. No effect without
   the query param. */

if (QUERY.has('selftest')) {
  setTimeout(() => {
    const results = [];
    const check = (name, cond) => results.push([name, !!cond]);
    check('canvas attached', renderer.domElement.isConnected);
    // frames-rendered, not wall-clock: an occluded tab throttles rAF but
    // still paints the first frames; a broken boot paints none
    check('render loop alive', renderer.info.render.frame > 0);
    togglePause(); check('pause', state === 'PAUSED');
    togglePause(); check('resume', state === 'PLAYING');
    dispatchEvent(new Event('resize'));
    check('resize handled', Math.abs(camera.aspect - innerWidth / innerHeight) < 1e-6);
    resetGame();
    const expectedScroll = ACTIVE_SLICE ? ACTIVE_SLICE.run.startScroll : 0;
    const expectedHostiles = ACTIVE_SLICE && SLICE_ENEMIES_ENABLED ? ACTIVE_SLICE.enemies.length : 0;
    check('restart', scrollX === expectedScroll && state === 'PLAYING' &&
      hostiles.length === expectedHostiles);
    if (ACTIVE_SLICE) {
      check('slice fixture selected', levelData.fixture === ACTIVE_SLICE);
      check('fixed dare reward', capsules.length === 1 && capsules[0].mode === 'fixed');
    }
    const fails = results.filter((r) => !r[1]).map((r) => r[0]);
    const msg = fails.length
      ? 'SELFTEST FAIL: ' + fails.join(', ')
      : 'SELFTEST PASS (' + results.length + ' checks)';
    console.log(msg);
    document.title = msg;
  }, 1500);
}

resetGame();
requestAnimationFrame(frame);
</script>
</body>
