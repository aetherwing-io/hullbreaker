  @keyframes victory-debrief-backdrop { from { opacity: 0; } to { opacity: 1; } }

  @keyframes victory-copy-muted { from { opacity: 0; transform: translateY(8px); } to { opacity: .62; transform: none; } }

  /* ---- game shell: stats / options panel + start screen ---- */
  #ovPanel { display: none; margin: 4px 0 16px; }
  #ovPanel .panel {
    min-width: 320px; max-width: min(560px, 88vw); margin: 0 auto;
    border: 1px solid rgba(255,233,194,.22); padding: 12px 16px 10px;
    background: rgba(7,19,26,.55);
  }
  #ovPanel .statgrid {
    display: grid; grid-template-columns: auto auto; gap: 2px 22px;
    justify-content: space-between; font-size: 13px; letter-spacing: .06em;
  }
  #ovPanel .statgrid .k { opacity: .55; text-align: left; }
  #ovPanel .statgrid .v { text-align: right; color: #ffe9c2; }
  #ovPanel .statgrid .v a { color: #e8edf2; opacity: .55; text-decoration: none; border-bottom: 1px dotted; }
  #ovPanel .statgrid .v a:hover { opacity: 1; }
  #ovPanel .statgrid .v b { color: #9ce23e; font-weight: 700; }
  #ovPanel .keys { margin: 10px 0 2px; font-size: 12px; opacity: .7; letter-spacing: .06em; }
  #ovPanel .keys b { color: #ffe9c2; }
  #ovPanel .note { margin: 8px 0 0; font-size: 11px; }

  #shell {
    position: fixed; inset: 0; z-index: 30; display: none; overflow: hidden;
    background: #07131a; color: #e8edf2;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    user-select: none;
  }
  #shell.on { display: block; }
  /* The module graph deliberately waits for production art before frame one.
     Keep that honest cold-start behind the title promise instead of exposing
     the already-mounted HUD over scene.background while the gate settles. */
  body.booting .hud, body.booting #touchDeck, body.booting #finale,
  body.booting #overlay { opacity: 0; pointer-events: none; }
  body.booting #shell {
    display: block;
    background: #07131a url('assets/generated/ui/title-meridian-ascent-v1.webp') 50% 50% / cover no-repeat;
  }
  body.booting #shell > * { visibility: hidden; }
  body.booting #shell::before {
    content: 'HULLBREAKER'; position: absolute; z-index: 2; left: 6%; top: 16%;
    color: #fff2d8; font-size: clamp(38px, 9vw, 88px); font-weight: 900;
    line-height: .9; letter-spacing: -.055em; text-shadow: 0 4px 24px rgba(5,15,22,.8);
  }
  body.booting #shell::after {
    content: 'BRINGING THE MERIDIAN ONLINE'; position: absolute; z-index: 2;
    left: 6%; top: calc(16% + clamp(48px, 10vw, 100px));
    color: rgba(232,237,242,.74); font-size: 10px; font-weight: 800;
    letter-spacing: .16em; text-shadow: 0 2px 8px #07131a;
  }
  body.at-title .hud, body.nohud .hud { opacity: 0; }
  #shellArt {
    position: absolute; inset: -1.5%; overflow: hidden;
    background: #07131a url('assets/generated/ui/title-meridian-ascent-v1.webp') 50% 50% / cover no-repeat;
    animation: title-breathe 13s ease-in-out infinite alternate;
  }
  #shellArt::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(7,19,26,.95) 0%, rgba(7,19,26,.72) 30%, rgba(7,19,26,.12) 64%, rgba(7,19,26,.18) 100%),
      linear-gradient(0deg, rgba(7,19,26,.62) 0%, transparent 32%, rgba(7,19,26,.14) 100%),
      radial-gradient(ellipse at 68% 43%, transparent 34%, rgba(7,19,26,.42) 100%);
  }
  /* Keep the data-backed composition in the layout for the existing shell
     contract and browser self-check, but let the production key art carry
     the player-facing screen. */
  #shellArt .sl { visibility: hidden; }
  @keyframes title-breathe {
    from { transform: scale(1.015) translate3d(-.25%, .2%, 0); }
    to   { transform: scale(1.055) translate3d(.35%, -.35%, 0); }
  }
  #shellArt .sl {
    position: absolute; left: var(--x); top: var(--y);
    width: var(--w); height: var(--h); opacity: var(--o, 1);
    transform: rotate(var(--rot, 0deg)); transform-origin: 50% 50%;
  }
  /* atmosphere */
  .sl-sky   { background: linear-gradient(172deg, var(--c) 0%, #07131a 82%); }
  .sl-glow  { background: radial-gradient(closest-side, var(--c), transparent 100%); }
  .sl-haze  { background: linear-gradient(180deg, transparent 0%, var(--c) 46%, transparent 100%); }
  .sl-vignette {
    background: radial-gradient(ellipse at 50% 44%, transparent 34%, var(--c) 100%);
  }
  .sl-steam {
    background: radial-gradient(closest-side, rgba(232,237,242,.22), transparent 100%);
    animation: sl-drift 11s ease-in-out infinite alternate;
  }
  /* machinery: flat facets, hard shadow side, rivet stripe */
  .sl-mass {
    background:
      repeating-linear-gradient(90deg, rgba(7,19,26,.34) 0 1px, transparent 1px 13px),
      linear-gradient(101deg, var(--c) 0%, rgba(7,19,26,.94) 74%);
    box-shadow: inset 0 0 0 1px rgba(7,19,26,.5);
  }
  .sl-slab {
    background:
      repeating-linear-gradient(90deg, rgba(7,19,26,.20) 0 2px, transparent 2px 46px),
      linear-gradient(96deg, rgba(7,19,26,.6) 0%, transparent 22%, transparent 74%, rgba(7,19,26,.8) 100%),
      linear-gradient(186deg, #96502a 0%, var(--c) 20%, #33200f 64%, #150d07 100%);
    box-shadow: inset 0 1px 0 rgba(255,233,194,.34), inset 0 -2px 0 rgba(7,19,26,.8),
                0 18px 44px rgba(7,19,26,.85);
  }
  .sl-bridge {
    background: linear-gradient(180deg, rgba(255,233,194,.28) 0 1px, var(--c) 1px, #1a1009 100%);
  }
  .sl-debris { background: linear-gradient(120deg, var(--c) 0%, #120b07 100%); }
  .sl-lamp   { background: var(--c); border-radius: 40%; box-shadow: 0 0 14px 4px var(--c); }
  .sl-beam   {
    background: linear-gradient(180deg, transparent 0%, var(--c) 22%, #fff 52%, var(--c) 78%, transparent 100%);
    box-shadow: 0 0 46px 14px var(--c);
  }
  /* RIG: one human-scale silhouette, 3.8% of frame height (board 13), warm
     against the dark machinery, with a muzzle flash off the barrel.
     The clip-path lives on ::before, NOT on .sl-rig itself: clip-path clips
     an element's pseudo-elements too, so a silhouette on the box would cut
     away the flash beside it (::after sits past the box's right edge) and
     nothing would render. */
  .sl-rig { filter: drop-shadow(0 1px 3px rgba(7,19,26,.95)); }
  .sl-rig::before {
    content: ''; position: absolute; inset: 0; background: var(--c);
    clip-path: polygon(40% 0%, 68% 9%, 60% 33%, 80% 43%, 62% 58%,
                       86% 100%, 64% 100%, 47% 70%, 30% 100%, 8% 95%,
                       32% 52%, 18% 27%);
  }
  .sl-rig::after {
    /* off the barrel: the silhouette's weapon arm reaches x = 80% */
    content: ''; position: absolute; left: 96%; top: 31%;
    width: 56%; height: 15%; background: #fff; border-radius: 50%;
    box-shadow: 0 0 10px 4px rgba(255,233,194,.9);
    animation: sl-flash 1.7s steps(1, end) infinite;
  }
  @keyframes sl-drift { from { transform: translate3d(0,0,0) scale(1); opacity: .5; }
                        to   { transform: translate3d(2%, -6%, 0) scale(1.25); opacity: .9; } }
  @keyframes sl-flash { 0%, 12% { opacity: 1; } 13%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .sl-steam, .sl-rig::after, #shellArt { animation: none; }
    #finale { transition: none; }
    #overlay.victory, #overlay.victory::before, #overlay.victory::after,
    #overlay.victory #ovTitle, #overlay.victory #ovBody p,
    #overlay.victory #ovPanel .result-panel { animation: none; }
    #overlay.victory::before { opacity: .55; transform: rotate(-6deg); }
    #overlay.victory::after { opacity: 1; }
    #overlay.victory #ovBody::before { display: none; }
  }
  #shellText {
    position: absolute; left: var(--tx); top: var(--ty); width: var(--tw);
    z-index: 2; min-width: 260px;
    text-shadow: 0 2px 18px rgba(7,19,26,.95), 0 0 42px rgba(7,19,26,.9);

  @media (prefers-reduced-motion: reduce) { #shellText .prompt { animation: none; } }
  #shellFoot {

    font-size: 11px; line-height: 1.8; letter-spacing: .08em; text-align: left;

  /* ---- failsafe panel (T-032) ----
     The only thing a player ever sees when the game breaks. It sits above
     the shell (z 30) and the state overlay (z 20) and is opaque, because
     what it replaces is a black void with an explanation nobody can see.
     Styled here, beside the markup, so the inline bootstrap below can show
     it with no stylesheet, font or module of its own to load. */
  #fail {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #07131a; color: #e8edf2; text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    padding: 24px; box-sizing: border-box; overflow: auto;

  #fail.on { display: flex; }
  #fail .failbox { max-width: min(620px, 92vw); }
  #fail h2 {
    margin: 0 0 16px; font-size: clamp(24px, 4.6vw, 42px);
    letter-spacing: .1em; color: #ffe9c2;
  }
  #fail p { margin: 8px 0; font-size: clamp(15px, 2.2vw, 19px); line-height: 1.55; }
  #failBtn {
    margin: 24px 0 10px; padding: 14px 32px; font: inherit; font-size: 20px;
    letter-spacing: .12em; color: #07131a; background: #9ce23e;
    border: 0; border-radius: 4px; cursor: pointer;

  #failBtn:focus-visible { outline: 3px solid #ffe9c2; outline-offset: 3px; }
  #fail .failhint { font-size: clamp(12px, 1.7vw, 15px); opacity: .72; }
  #fail details { margin-top: 26px; text-align: left; font-size: 12px; opacity: .5; }
  #fail summary { cursor: pointer; letter-spacing: .06em; }
  #fail pre {
    white-space: pre-wrap; word-break: break-word;
    max-height: 32vh; overflow: auto; margin: 8px 0 0;
  }

  /* Phones in landscape are wide but short, so width-only mobile rules never
     reached them. Keep each instrument in its own row and reserve the lower
     edge for touch instead of letting three HUD strings collide. */

         (max-height: 520px) and (max-width: 980px) {

      top: max(7px, var(--hud-safe-top)); left: max(10px, var(--hud-safe-left));
      width: min(300px, 36vw); min-width: 0; padding: 6px 8px;

<!-- ===== FAILSAFE BOOTSTRAP (T-032) ==================================
     Everything in this block runs before the game and imports nothing.
     That is the entire point. On 2026-08-02 one stale cached module failed
     to parse; ES modules are all-or-nothing, so src/main.js never executed
     and the page was a black void with a single console line. A panel
     drawn BY main.js cannot report that main.js never ran, so the handler
     has to live here, in a classic inline script, with no dependency that
     could fail with it.

     Catches: an uncaught error or a rejected promise before boot (panel:
     "could not start"), a module or import-map that fails to load, a boot
     that never finishes (watchdog), a frame loop that stops beating on a
     visible page (freeze watchdog), and — after boot — whatever
     src/ui/failsafe.js's policy decides is more than a blip.

     Does NOT catch: this page failing to arrive at all (the browser's own
     error page), a game that keeps running while quietly doing the wrong
     thing (nothing throws, so nothing fires here), or a broken frame that
     src/ui/failsafe.js chooses to ride out.

     The words are a table so tools/pathcheck.mjs can read them out of this
     file and hold them to src/pure/failsafe.js's plain-language rule: this
     screen is read by a 9-year-old, and the engineering detail belongs
     behind the fold, not in his face.
================================================================== -->
<script>
(function () {
  'use strict';

  var HB_FAIL_TEXT = {
    "boot": {
      "t": "The game could not start.",
      "b": "Something inside it broke before it could open. It is not your fault.",
      "a": "Try again"
    },
    "crash": {
      "t": "The game stopped.",
      "b": "Something inside it broke while you were playing. It is not your fault.",
      "a": "Play again"
    },
    "frozen": {
      "t": "The game got stuck.",
      "b": "The picture stopped moving, so the game shut itself down. It is not your fault.",
      "a": "Play again"
    },
    "slow": {
      "t": "Still loading.",
      "b": "The game is taking a long time to open. Wait a moment, or start it again.",
      "a": "Try again"
    },
    "hint": "Press R, or click the button, to play again.",
    "tell": "If this keeps happening, show this screen to a grown-up.",
    "more": "What broke (for grown-ups)"
  };

  // mirrors FAILSAFE in src/pure/failsafe.js; pathcheck asserts they agree
  var WATCH = { bootMs: 10000, stallMs: 4000, tickMs: 1000 };
  var KEYS = ['KeyR', 'Enter', 'Space'];
  var HARD = { boot: 1, crash: 1, frozen: 1 };     // panels that never downgrade

  var booted = false, showing = null, beats = 0, errors = 0, waiting = false;
  var notes = [];
  var now = Date.now();
  var visibleSince = now, lastBeatAt = now, lastBeats = 0, lastTickAt = now;

  function el(id) { return document.getElementById(id); }

  function note(detail) {
    if (!detail) return;
    if (notes.length < 24) notes.push(detail);
    var pre = el('failDetail');
    if (pre && showing) pre.textContent = notes.join('\n\n');
  }

  function paint(kind) {
    var box = el('fail');
    if (!box) return false;
    var text = HB_FAIL_TEXT[kind] || HB_FAIL_TEXT.crash;
    el('failTitle').textContent = text.t;
    el('failBody').textContent = text.b;
    el('failBtn').textContent = text.a;
    el('failHint').textContent = HB_FAIL_TEXT.hint;
    el('failTell').textContent = HB_FAIL_TEXT.tell;
    el('failMore').textContent = HB_FAIL_TEXT.more;
    el('failDetail').textContent = notes.join('\n\n');
    box.classList.add('on');
    try { el('failBtn').focus(); } catch (e) { /* focus is a nicety */ }
    return true;
  }

  function show(kind, detail) {
    note(detail);
    if (HARD[showing] && !HARD[kind]) return;      // never talk a failure down
    showing = kind;
    if (paint(kind) || waiting) return;
    waiting = true;                                // body not parsed yet
    document.addEventListener('DOMContentLoaded', function () {
      if (showing) paint(showing);
    });
  }

  function hide() {
    showing = null;
    var box = el('fail');
    if (box) box.classList.remove('on');
  }

  function again() {
    try { location.reload(); } catch (e) { location.href = location.href; }
  }

  function describe(ev) {
    var when = new Date().toISOString();
    if (ev && ev.type === 'unhandledrejection') {
      var r = ev.reason;
      return when + '  unfinished work failed: ' +
        ((r && (r.stack || r.message)) || String(r));
    }
    if (ev && ev.target && ev.target !== window && (ev.target.src || ev.target.href))
      return when + '  could not load ' + (ev.target.src || ev.target.href);
    var where = ev && ev.filename
      ? ' (' + ev.filename + ':' + ev.lineno + ':' + ev.colno + ')' : '';
    var stack = ev && ev.error && ev.error.stack
      ? '\n' + String(ev.error.stack).split('\n').slice(0, 5).join('\n') : '';
    return when + '  ' + ((ev && ev.message) || 'unknown failure') + where + stack;
  }

  function caught(ev) {
    errors++;
    var detail = describe(ev);
    var target = ev && ev.target;
    var resource = target && target !== window && (target.src || target.href);
    // a picture or a stylesheet that failed to arrive is not a dead game; a
    // SCRIPT that failed is exactly the incident this handler exists for, and
    // so is any error with no element behind it
    var fatal = !resource || String(target.tagName).toUpperCase() === 'SCRIPT';
    if (!booted && fatal) { show('boot', detail); return; }
    note(detail);
    if (typeof API.onUncaught === 'function') {
      try { API.onUncaught(detail); } catch (e) { /* the policy is optional */ }
    }
  }

  addEventListener('error', caught, true);         // capture: also catches a
  addEventListener('unhandledrejection', caught);  //   script that never loaded

  addEventListener('keydown', function (ev) {
    if (!showing || KEYS.indexOf(ev.code) < 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    again();
  }, true);

  addEventListener('click', function (ev) {
    if (showing && ev.target && ev.target.id === 'failBtn') { ev.preventDefault(); again(); }
  }, true);

  document.addEventListener('visibilitychange', function () {
    // a hidden tab paints nothing by design: reset every watchdog baseline
    // so returning from one is never mistaken for a stuck game
    var t = Date.now();
    visibleSince = t; lastBeatAt = t; lastTickAt = t;
  });

  setTimeout(function () { if (!booted) show('slow'); }, WATCH.bootMs);

  setInterval(function () {
    var t = Date.now();
    var slept = t - lastTickAt > WATCH.tickMs * 3;  // our own timer was suspended:
    lastTickAt = t;                                 //   the page was frozen, not stuck
    if (beats !== lastBeats) { lastBeats = beats; lastBeatAt = t; }
    if (!booted || showing || slept) return;
    if (document.visibilityState !== 'visible') { visibleSince = t; lastBeatAt = t; return; }
    if (t - visibleSince < WATCH.stallMs) return;
    if (t - lastBeatAt >= WATCH.stallMs)
      show('frozen', new Date().toISOString() + '  the frame loop stopped ' +
        Math.round((t - lastBeatAt) / 1000) + 's ago');
  }, WATCH.tickMs);

  var API = {
    version: 1,
    show: show,
    hide: hide,
    note: note,
    again: again,
    // Reaching this means src/main.js ran to its last line, so the game IS
    // up: any panel raised on the way in was about something the boot
    // survived (a slow load, an async failure in a module that still
    // finished) and must come down. A genuine boot failure never gets here
    // — that is the whole point of it being the last statement in main.js.
    booted: function () {
      booted = true;
      if (showing === 'slow' || showing === 'boot') hide();
    },
    isBooted: function () { return booted; },
    beat: function () { beats++; },
    beats: function () { return beats; },
    errors: function () { return errors; },
    showing: function () { return showing; },
    detail: function () { return notes.join('\n\n'); },
    text: HB_FAIL_TEXT,
    watch: WATCH,
    keys: KEYS,
    onUncaught: null,
  };
  window.__HB_FAILSAFE = API;
})();
</script>
