  <path fill="#767c8588" d="M31 17 35 17 35 20 31 20Z"/>
  <path fill="#9b5c31a6" d="M28 22 36 22 36 32 33 39 35 48 32 63 28 57 30 46 27 37Z"/>
  <path fill="#9b5c317d" d="M33 27 36 31 34 43 35 51 32 58 31 45Z"/>

