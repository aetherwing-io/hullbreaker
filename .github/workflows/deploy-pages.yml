name: Deploy tagged release to Pages

on:
  push:
    tags:
      - 'v*'

# A release is immutable. If two tags arrive close together, finish the first
# deployment before starting the next instead of cancelling a live publish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tag to be the current main tip
        shell: bash
        run: |
          git fetch --no-tags origin main
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse "origin/main^{commit}")"
          if [[ "$tagged_commit" != "$main_commit" ]]; then
            echo "::error title=Tag is not current main::${GITHUB_REF_NAME} points to ${tagged_commit}, but origin/main is ${main_commit}. Tag the current main tip to deploy."
            exit 1
          fi
          echo "RELEASE_COMMIT=${tagged_commit}" >> "${GITHUB_ENV}"
          echo "Deploying ${GITHUB_REF_NAME} from ${tagged_commit}."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/deploy/package-lock.json

      - name: Install deployment verifier
        run: npm ci --prefix tools/deploy

      - name: Install verifier browser
        run: node tools/deploy/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Verify shared-asset union policy
        run: node tools/deploy/asset-union-selftest.mjs

      - name: Build release bundle
        run: |
          mkdir -p "${RUNNER_TEMP}/hullbreaker-pages/site"
          node tools/deploy/build-bundle.mjs \
            --ref "${RELEASE_COMMIT}" \
            --out "${RUNNER_TEMP}/hullbreaker-pages/hullbreaker-web.zip"

      - name: Verify release bundle
        run: |
          node tools/deploy/verify-bundle.mjs \
            --zip "${RUNNER_TEMP}/hullbreaker-pages/hullbreaker-web.zip"

      - name: Build cache-consistent Pages site
        run: |
          node tools/deploy/build-pages-site.mjs \
            --zip "${RUNNER_TEMP}/hullbreaker-pages/hullbreaker-web.zip" \
            --ref "${RELEASE_COMMIT}" \
            --retain-tags 4 \
            --out "${RUNNER_TEMP}/hullbreaker-pages/site"

      - name: Verify warm-cache release rollover
        run: |
          node tools/deploy/verify-pages-site.mjs \
            --site "${RUNNER_TEMP}/hullbreaker-pages/site" \
            --revision "${RELEASE_COMMIT}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hullbreaker-pages/site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
